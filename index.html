<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vantage Point — Insider Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="./vp-data.js"></script>
<style>
html,body{margin:0;padding:0;background:#f4ede0;min-height:100vh;font-family:'Inter',system-ui,sans-serif;}
*::-webkit-scrollbar{width:6px;height:6px;}
*::-webkit-scrollbar-thumb{background:rgba(26,22,18,.18);border-radius:3px;}
*::-webkit-scrollbar-track{background:transparent;}
.vp{--bg:#f4ede0;--bg-soft:#ebe2d1;--bg-card:#fffbf3;
  --rule:#1a1612;--rule-soft:#cdc2ab;
  --ink:#1a1612;--ink-mid:#5a5044;--ink-soft:#8a8174;
  --accent:#9b2222;--buy:#2e7d4f;--sell:#a32a2a;
  --serif:"Source Serif 4",Georgia,serif;
  --sans:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --font-serif:"Source Serif 4",Georgia,serif;
  --font-sans:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;min-height:100vh;}
.vp *{box-sizing:border-box;}.vp a{color:inherit;text-decoration:none;cursor:pointer;}.vp button{font-family:inherit;}
.vp .container{max-width:1340px;margin:0 auto;padding:0 36px;}
/* UTIL */
.vp .util{border-bottom:1px solid var(--rule);background:var(--ink);color:var(--bg);font-size:11px;position:sticky;top:0;z-index:900;}
.vp .util .container{display:flex;align-items:center;height:36px;gap:20px;}
.vp .util-brand{display:flex;align-items:center;gap:8px;padding-right:20px;border-right:1px solid rgba(244,237,224,.2);cursor:pointer;flex-shrink:0;}
.vp .util-mark{width:20px;height:20px;background:#f3d27a;display:flex;align-items:center;justify-content:center;}
.vp .util-brand-text{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--bg);}
.vp .util-brand-text em{font-style:italic;color:#f3d27a;}
.vp .util-nav{display:flex;gap:18px;overflow-x:auto;}
.vp .util-nav a{letter-spacing:.5px;text-transform:uppercase;font-weight:600;opacity:.65;transition:opacity .15s;font-size:10px;white-space:nowrap;}
.vp .util-nav a:hover,.vp .util-nav a.on{opacity:1;}.vp .util-nav a.on{color:#f3d27a;}
.vp .util-right{display:flex;gap:14px;align-items:center;margin-left:auto;opacity:.7;font-size:10px;flex-shrink:0;}
.vp .pulse{width:6px;height:6px;border-radius:50%;background:#5fb37a;display:inline-block;margin-right:4px;animation:vpP 2s infinite;}
@keyframes vpP{0%,100%{box-shadow:0 0 0 0 rgba(95,179,122,.5);}70%{box-shadow:0 0 0 5px rgba(95,179,122,0);}}
/* CHIP */
.vp .chip{background:var(--bg-card);border:1px solid var(--rule-soft);color:var(--ink-mid);padding:5px 11px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.2px;transition:all .12s;}
.vp .chip:hover{border-color:var(--ink);color:var(--ink);}.vp .chip.on,.vp .chip.chip-active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.vp .chip.danger.on{background:var(--accent);border-color:var(--accent);color:#fff;}
/* SEARCH */
.vp .srch{position:relative;display:inline-block;}
.vp .srch input{background:var(--bg-card);border:1px solid var(--rule-soft);color:var(--ink);padding:7px 12px 7px 30px;font-family:inherit;font-size:12px;outline:none;transition:border .15s;width:220px;}
.vp .srch input:focus{border-color:var(--ink);}
.vp .srch::before{content:'⌕';position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:14px;pointer-events:none;}
.vp .srch input::placeholder{color:var(--ink-soft);}
/* TABLE */
.vp table{width:100%;border-collapse:collapse;font-size:13px;}
.vp thead th{font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--ink-soft);padding:10px 12px;text-align:left;border-bottom:1px solid var(--rule);border-top:1px solid var(--rule);background:var(--bg-soft);cursor:pointer;user-select:none;white-space:nowrap;}
.vp thead th.r{text-align:right;}.vp thead th .sa{display:inline-block;margin-left:4px;opacity:.4;font-size:9px;}
.vp thead th.active .sa{opacity:1;color:var(--accent);}.vp thead th.active{color:var(--ink);}
.vp tbody td{padding:12px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:middle;}
.vp tbody tr{cursor:pointer;transition:background .1s;}.vp tbody tr:hover{background:var(--bg-soft);}
.vp tbody tr.sel{background:var(--bg-card);box-shadow:inset 3px 0 0 var(--accent);}
.vp .td-tk{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.3px;line-height:1;}
.vp .td-tk .co{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ink-soft);margin-top:2px;}
.vp .td-ins{font-weight:600;}.vp .td-ins .t{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);margin-top:2px;}
.vp .td-type{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border:1px solid;display:inline-block;}
.vp .td-type.buy{color:var(--buy);border-color:var(--buy);}.vp .td-type.sell{color:var(--sell);border-color:var(--sell);}
.vp .pol-pill{font-size:8px;font-weight:700;padding:2px 5px;background:var(--accent);color:#fff;letter-spacing:.5px;margin-left:5px;vertical-align:1px;}
.vp .live-pill{font-size:8px;font-weight:700;padding:2px 5px;background:#2e7d4f;color:#fff;letter-spacing:.5px;margin-left:5px;vertical-align:1px;}
.vp .sig-badge{font-size:9px;font-weight:700;padding:3px 8px;border:1px solid;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.vp .sig-conviction{color:var(--buy);border-color:var(--buy);}
.vp .sig-strategic{color:#3a6da3;border-color:#3a6da3;}
.vp .sig-opportunistic{color:#9b7a22;border-color:#9b7a22;}
.vp .sig-routine{color:var(--ink-soft);border-color:var(--rule-soft);}
.vp .sig-bearish{color:var(--sell);border-color:var(--sell);}
.vp .sig-political{color:#6a3080;border-color:#6a3080;}
.vp .td-val{font-family:var(--mono);font-weight:600;font-size:13px;}
.vp .score-wrap{display:inline-flex;align-items:center;gap:7px;}
.vp .score-bar{width:42px;height:3px;background:var(--rule-soft);position:relative;}
.vp .score-fill{position:absolute;left:0;top:0;height:100%;background:var(--ink);}
.vp .score-num{font-family:var(--mono);font-weight:700;font-size:13px;}
.vp .score-wrap.hi .score-fill{background:var(--buy);}.vp .score-wrap.hi .score-num{color:var(--buy);}
.vp .spark{width:72px;height:22px;vertical-align:middle;}
.vp .tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:11px;color:var(--ink-soft);}
.vp .pag{display:flex;gap:2px;}
.vp .pag button{background:transparent;border:1px solid var(--rule-soft);color:var(--ink-soft);width:30px;height:30px;font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .12s;}
.vp .pag button:disabled{opacity:.3;cursor:default;}
.vp .pag button:not(:disabled):hover,.vp .pag button.on{border-color:var(--ink);color:var(--ink);background:var(--bg-soft);}
/* PANELS */
.vp .panel{background:var(--bg-card);border:1px solid var(--rule-soft);}
.vp .panel-hd{padding:12px 16px;border-bottom:1px solid var(--rule-soft);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;}
.vp .panel-bd{padding:14px 16px;}
/* SEC HDR */
.vp .sec-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--rule);}
.vp .sec-h{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.5px;}
.vp .sec-more{font-size:11px;color:var(--ink-soft);text-transform:uppercase;font-weight:600;letter-spacing:.5px;}
/* MODALS */
.vp .overlay{display:none;position:fixed;inset:0;background:rgba(26,22,18,.72);z-index:999;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.vp .overlay.open{display:flex;}
.vp .modal{background:var(--bg-card);border:1px solid var(--rule);max-height:92vh;overflow:hidden;display:flex;flex-direction:column;animation:vpSlide .2s ease;}
@keyframes vpSlide{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.vp .modal-hd{padding:20px 24px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:center;gap:14px;background:var(--bg-soft);flex-shrink:0;}
.vp .modal-bd{padding:22px 24px;overflow-y:auto;flex:1;}
.vp .modal-x{margin-left:auto;background:none;border:1px solid var(--rule-soft);color:var(--ink-soft);width:32px;height:32px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.vp .modal-x:hover{border-color:var(--sell);color:var(--sell);}
.vp .modal-mask{position:fixed;inset:0;background:rgba(26,22,18,.72);z-index:999;backdrop-filter:blur(3px);}
.vp .modal-wrap{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.vp .modal-wrap>.modal-wrap-inner,.vp .modal-wrap>div[style]{pointer-events:all;}
.vp .modal-avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.vp .modal-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0;}
.vp .modal-av.buy{background:linear-gradient(135deg,#2e7d4f,#1a5c34);}
.vp .modal-av.sell{background:linear-gradient(135deg,#a32a2a,#7a1f1f);}
.vp .modal-av.pol{background:linear-gradient(135deg,#6a3080,#3a1a50);}
.vp .modal-name{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1;}
.vp .modal-sub{font-size:11px;color:var(--ink-soft);margin-top:3px;}
/* STAT BOXES */
.vp .stats-grid{display:grid;gap:10px;margin-bottom:16px;}
.vp .stat-box{background:var(--bg-soft);border:1px solid var(--rule-soft);padding:12px 14px;}
.vp .stat-box-l{font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:4px;}
.vp .stat-box-v{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.4px;line-height:1;}
.vp .stat-box-v.buy{color:var(--buy);}.vp .stat-box-v.sell{color:var(--sell);}.vp .stat-box-v.accent{color:var(--accent);}
/* AI BOX */
.vp .ai-box{background:var(--bg-soft);border:1px solid var(--rule-soft);border-left:3px solid var(--accent);padding:14px 16px;margin-bottom:16px;}
.vp .ai-box-hd{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.vp .ai-text{font-size:13px;line-height:1.7;color:var(--ink-mid);}
.vp .ai-text strong{color:var(--ink);}
.vp .ai-bullets{margin-top:10px;display:flex;flex-direction:column;gap:5px;}
.vp .ai-bullet{font-size:12px;color:var(--ink-soft);padding-left:14px;position:relative;line-height:1.5;}
.vp .ai-bullet::before{content:'·';position:absolute;left:4px;color:var(--accent);font-weight:700;}
/* TIMELINE */
.vp .tl-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule-soft);}
.vp .tl-item:last-child{border-bottom:none;}
.vp .tl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.vp .tl-dot.buy{background:var(--buy);}.vp .tl-dot.sell{background:var(--sell);}
.vp .tl-body{flex:1;}.vp .tl-action{font-size:12px;font-weight:600;}.vp .tl-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.vp .tl-perf{display:flex;gap:10px;margin-top:5px;font-family:var(--mono);font-size:11px;}
.vp .tl-val{font-family:var(--mono);font-size:12px;font-weight:700;flex-shrink:0;margin-left:auto;}
/* WIN BADGE */
.vp .win-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--rule-soft);background:var(--bg-soft);font-family:var(--mono);font-size:12px;font-weight:700;}
.vp .win-badge.good{border-color:var(--buy);color:var(--buy);}.vp .win-badge.ok{border-color:#9b7a22;color:#9b7a22;}.vp .win-badge.bad{border-color:var(--sell);color:var(--sell);}
/* FAV */
.vp .fav-btn{background:none;border:1px solid var(--rule-soft);width:32px;height:32px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.vp .fav-btn:hover{border-color:var(--accent);}.vp .fav-btn.on{border-color:#c97a3a;color:#c97a3a;}
/* ALERT MODAL BUTTON */
.vp .alert-btn{background:var(--bg-soft);border:1px solid var(--rule-soft);padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .12s;}
.vp .alert-btn:hover{border-color:var(--ink);}
/* INSTITUTIONAL */
.vp .inst-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:12px;}
.vp .inst-row:last-child{border-bottom:none;}.vp .inst-name{flex:1;font-weight:600;}
.vp .inst-bar-wrap{width:80px;height:5px;background:var(--bg-soft);}
.vp .inst-bar-fill{height:100%;background:var(--ink);}
.vp .inst-pct{font-family:var(--mono);font-size:12px;font-weight:600;width:38px;text-align:right;}
/* EARNINGS */
.vp .earn-box{background:var(--bg-soft);border:1px solid var(--rule-soft);padding:14px 16px;margin-bottom:14px;}
.vp .earn-hd{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;}
.vp .earn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.vp .earn-l{font-size:9px;color:var(--ink-soft);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:3px;}
.vp .earn-v{font-family:var(--mono);font-size:13px;font-weight:700;}
.vp .earn-cd{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;background:var(--bg-card);border:1px solid var(--rule-soft);font-family:var(--mono);font-size:11px;font-weight:600;margin-top:8px;}
.vp .earn-cd.soon{border-color:var(--accent);color:var(--accent);}
/* FOOTER */
.vp footer{background:var(--ink);color:var(--bg);padding:44px 0 24px;}
.vp .foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;}
.vp .foot-title{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.5px;margin-bottom:8px;}
.vp .foot-title em{font-style:italic;font-weight:500;}
.vp .foot-tag{font-family:var(--serif);font-style:italic;font-size:13px;opacity:.75;margin-bottom:16px;line-height:1.5;max-width:300px;}
.vp .foot-sub{display:flex;border:1px solid rgba(244,237,224,.3);max-width:320px;}
.vp .foot-sub input{flex:1;background:transparent;border:0;color:var(--bg);padding:9px 12px;font-family:inherit;font-size:12px;outline:none;}
.vp .foot-sub button{background:var(--bg);color:var(--ink);border:0;padding:0 14px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.vp .foot-col h4{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;margin:0 0 12px;font-weight:700;}
.vp .foot-col ul{list-style:none;padding:0;margin:0;}
.vp .foot-col li{margin-bottom:7px;font-size:12px;opacity:.72;cursor:pointer;}
.vp .foot-col li:hover{opacity:1;}
.vp .foot-bot{border-top:1px solid rgba(244,237,224,.15);margin-top:28px;padding-top:16px;font-size:10px;opacity:.55;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
/* KEYBOARD SHORTCUT HINT */
.vp .kbd{display:inline-block;padding:1px 5px;border:1px solid var(--rule-soft);background:var(--bg-soft);font-family:var(--mono);font-size:10px;border-radius:2px;margin-left:4px;}
/* TRACK RECORD */
.vp .backtest-stat{background:var(--bg-card);border:1px solid var(--rule-soft);padding:18px 20px;text-align:center;}
.vp .backtest-stat .bs-l{font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:8px;}
.vp .backtest-stat .bs-v{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-.6px;line-height:1;}
.vp .backtest-stat .bs-sub{font-size:11px;color:var(--ink-soft);margin-top:4px;}
/* MY PORTFOLIO (T212) */
.vp .t212-hero{background:linear-gradient(135deg,var(--bg-card) 0%,var(--bg-soft) 100%);border:1px solid var(--rule-soft);padding:28px 32px;margin-bottom:20px;position:relative;overflow:hidden;}
.vp .t212-hero::before{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(46,125,79,.08) 0%,transparent 70%);pointer-events:none;}
.vp .t212-api-row{display:flex;gap:10px;align-items:center;margin-top:14px;}
.vp .t212-api-input{flex:1;background:var(--bg);border:1px solid var(--rule-soft);color:var(--ink);padding:10px 14px;font-family:var(--font-mono);font-size:12px;outline:none;transition:border .15s;max-width:480px;}
.vp .t212-api-input:focus{border-color:var(--buy);}
.vp .t212-api-input::placeholder{color:var(--ink-soft);font-family:var(--font-sans);}
.vp .t212-btn{background:var(--ink);color:var(--bg);border:none;padding:10px 20px;font-family:var(--font-sans);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:opacity .15s;}
.vp .t212-btn:hover{opacity:.82;}.vp .t212-btn:disabled{opacity:.4;cursor:default;}
.vp .t212-btn.danger{background:var(--sell);}
.vp .t212-holding{background:var(--bg-card);border:1px solid var(--rule-soft);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.vp .t212-holding:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.06);}
.vp .t212-holding.has-buy{border-left:3px solid var(--buy);}
.vp .t212-holding.has-sell{border-left:3px solid var(--sell);}
.vp .t212-holding.has-risk{border-left:3px solid var(--accent);}
.vp .pf-donut{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.vp .pf-legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.vp .t212-err{background:#fce8e8;border:1px solid #e8c4c4;border-left:3px solid var(--sell);padding:12px 16px;font-size:12px;color:var(--sell);margin-top:10px;}
.vp .t212-note{font-size:11px;color:var(--ink-soft);margin-top:8px;line-height:1.6;}
/* ABOUT */
.vp .about-card{background:var(--bg-card);border:1px solid var(--rule-soft);padding:28px 32px;}
.vp .about-tag{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.vp .about-tag::before{content:'';width:24px;height:1px;background:var(--accent);display:inline-block;}
.vp .about-h{font-family:var(--serif);font-size:36px;font-weight:600;letter-spacing:-.7px;line-height:1.05;margin-bottom:12px;}
.vp .about-dek{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-mid);line-height:1.5;margin-bottom:18px;max-width:580px;}
.vp .about-p{font-size:14px;line-height:1.72;color:var(--ink-mid);margin-bottom:12px;max-width:680px;}
.vp .about-contact{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
.vp .about-link{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--rule-soft);background:var(--bg-soft);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.vp .about-link:hover{border-color:var(--ink);background:var(--bg-card);}
/* DARK MODE */
.vp.dark{--bg:#151210;--bg-soft:#1e1a16;--bg-card:#211d18;
  --rule:#3a342c;--rule-soft:#2e2820;
  --ink:#f4ede0;--ink-mid:#c8b89a;--ink-soft:#8a7a6a;
  --accent:#c94040;--buy:#4caf72;--sell:#e05555;}
/* BADGES V6 */
.vp .badge-10b51{background:#f0ede8;color:#8a7a6a;border:1px solid #ccc4b4;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700;letter-spacing:.5px;}
.vp .badge-form144{background:#fce8e8;color:#a32a2a;border:1px solid #e8c4c4;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700;}
.vp .badge-options{background:#e8f0fe;color:#1a56a0;border:1px solid #b8d0f0;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700;}
.vp .badge-squeeze{background:#fff3e0;color:#8a4a00;border:1px solid #f0d0a0;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700;}
.vp .badge-momentum{background:#e8f5e9;color:#1a6e3c;border:1px solid #b8dfc4;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700;}
.vp .badge-whale{background:#f3e8ff;color:#6a1fa0;border:1px solid #d4b0f0;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700;}
.vp .badge-earnings{background:#fff8e0;color:#7a5800;border:1px solid #f0d870;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700;}
.vp .badge-si-up{background:#fce8e8;color:#8a1a1a;border:1px solid #e8b4b4;font-size:9px;padding:1px 6px;border-radius:3px;font-weight:700;}
.vp .consensus-ring{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:13px;flex-shrink:0;}
/* AUTH MODAL */
.vp .auth-input{width:100%;background:var(--bg);border:1px solid var(--rule-soft);color:var(--ink);padding:10px 13px;font-family:inherit;font-size:13px;outline:none;border-radius:4px;transition:border .15s;}
.vp .auth-input:focus{border-color:var(--ink);}
.vp .auth-btn-primary{width:100%;background:var(--ink);color:var(--bg);border:none;padding:11px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border-radius:4px;transition:opacity .15s;}
.vp .auth-btn-primary:hover{opacity:0.85;}
.vp .auth-btn-secondary{background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
.vp .auth-btn-secondary:hover{color:var(--ink);}
/* EQUITY CURVE */
.vp .eq-curve-wrap{position:relative;height:180px;background:var(--bg);border:1px solid var(--rule-soft);border-radius:6px;overflow:hidden;}
/* MOBILE TAPE CARD */
@media(max-width:700px){.vp .tape-table-wrap{display:none;}.vp .tape-cards{display:flex!important;}}
.vp .tape-cards{display:none;flex-direction:column;gap:8px;}
.vp .tape-card{background:var(--bg-card);border:1px solid var(--rule-soft);border-radius:8px;padding:12px 14px;cursor:pointer;}
.vp .tape-card:hover{border-color:var(--accent);}
/* CSV EXPORT BTN */
.vp .export-btn{display:inline-flex;align-items:center;gap:5px;background:var(--bg-soft);border:1px solid var(--rule-soft);color:var(--ink-mid);padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;border-radius:3px;font-family:inherit;transition:all .12s;}
.vp .export-btn:hover{border-color:var(--ink);color:var(--ink);}
/* HEATMAP */
.vp .heatmap-cell{border-radius:6px;padding:12px 14px;cursor:pointer;transition:transform .12s;}
.vp .heatmap-cell:hover{transform:scale(1.02);}
/* PORTFOLIO */
.vp .portfolio-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--rule-soft);border-radius:6px;margin-bottom:6px;cursor:pointer;transition:border-color .12s;}
.vp .portfolio-row:hover{border-color:var(--accent);}
.vp .pf-ticker{font-family:var(--mono);font-weight:700;font-size:13px;min-width:52px;}
.vp .pf-ret{font-family:var(--mono);font-size:13px;font-weight:700;min-width:60px;text-align:right;}
.vp .pf-alpha{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;min-width:110px;text-align:center;}
/* CLUSTER CARDS */
.vp .cluster-card{background:var(--bg-soft);border:2px solid var(--rule-soft);border-radius:10px;overflow:hidden;transition:border-color .15s,box-shadow .15s;}
.vp .cluster-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(0,0,0,0.08);}
.vp .cluster-insider-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border:1px solid var(--rule-soft);border-radius:6px;cursor:pointer;transition:border-color .1s,background .1s;}
.vp .cluster-insider-row:hover{border-color:var(--accent);background:var(--bg-soft);}
/* IMPROVED STAT BOXES */
.vp .stat-box{background:var(--bg-soft);border:1px solid var(--rule-soft);padding:12px 14px;transition:border-color .12s;}
.vp .stat-box:hover{border-color:var(--ink-mid);}
.vp .stat-box-l{font-size:9px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:5px;}
.vp .stat-box-v{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.4px;line-height:1;}
/* ALPHA BEAT BANNER */
.vp .alpha-beat{background:linear-gradient(135deg,#e8f5e9,#d4edda);border:1px solid #b8dfc4;border-left:4px solid var(--buy);padding:10px 14px;border-radius:0 6px 6px 0;margin:8px 0;}
.vp .alpha-beat-dark{background:linear-gradient(135deg,rgba(46,125,79,0.15),rgba(46,125,79,0.08));border:1px solid rgba(46,125,79,0.3);border-left:4px solid var(--buy);}
/* RESPONSIVE */
@media(max-width:960px){.vp .container{padding:0 18px;}.vp .foot-grid{grid-template-columns:1fr 1fr;gap:20px;}.vp .col-hide{display:none!important;}}
@media(max-width:700px){.vp .stats-grid{grid-template-columns:repeat(2,1fr)!important;}.vp .cluster-insider-row{flex-wrap:wrap;}}
@media(max-width:640px){.vp .foot-grid{grid-template-columns:1fr;}.vp thead th{padding:8px 6px;font-size:8px;}.vp tbody td{padding:9px 6px;}.vp .td-tk{font-size:14px;}.vp .util-right{display:none;}}
</style>

window.onerror = function(msg, src, line, col, err) {
  document.body.innerHTML = '<div style="background:#fff;padding:40px;font-family:monospace;color:red;font-size:14px;white-space:pre-wrap">' +
    '<h2 style="color:#c00">JavaScript Error</h2>' +

    '<b>Source:</b> ' + src + '\n' +
    '<b>Line:</b> ' + line + ' Col: ' + col + '\n' +
    (err ? '<b>Stack:</b> ' + err.stack : '') +
    '</div>';
  return true;
};
window.addEventListener('unhandledrejection', function(e) {
  document.body.innerHTML = '<div style="background:#fff;padding:40px;font-family:monospace;color:red;font-size:14px;white-space:pre-wrap">' +
    '<h2 style="color:#c00">Unhandled Promise Rejection</h2>' + e.reason + '</div>';
});
</script>

const hasItems=(value)=>Array.isArray(value)&&value.length>0;
const hasFields=(value)=>!!value&&typeof value==='object'&&!Array.isArray(value)&&Object.keys(value).length>0;
const normalizeInstitutions=(rows)=>Array.isArray(rows)?rows.map(row=>Array.isArray(row)?{name:row[0],pctHeld:row[1],value:null}:row).filter(row=>row&&row.name):[];

const getTradeDate=(txn)=>{
  if(txn&&txn.tradeDate) return txn.tradeDate;
  const d=new Date();
  d.setDate(d.getDate()-(txn&&txn.filedDate||0));
  return d.toISOString().slice(0,10);
};
const roleScore=(title='')=>/CEO|Founder|Chair/i.test(title)?26:/CFO|President|Chief/i.test(title)?18:/Director|Board/i.test(title)?12:8;
const sizeScore=(value=0)=>Math.min(35,Math.max(4,Math.round(Math.log10(Math.max(value,1))*6-8)));
const clusterBonus=(txn,allTxns)=>{
  if(!txn||!allTxns) return 0;
  const nearby=allTxns.filter(t=>t.ticker===txn.ticker&&t.type==='Buy'&&Math.abs((t.filedDate??0)-(txn.filedDate??0))<=30);
  return new Set(nearby.map(t=>t.insider)).size>=2?18:4;
};
function normalizeSnapshotTxn(txn,allTxns){
  const company=getCompany(txn.ticker);
  const type=txn.type==='Buy'?'Buy':'Sell';
  const filedDate=txn.filedDate!=null?txn.filedDate:Math.max(0,Math.round((Date.now()-new Date(txn.tradeDate||Date.now()))/86400000));
  const performance=txn.performance||{};
  const score=txn.score||(()=>{
    const size=sizeScore(txn.value||0);
    const role=roleScore(txn.title||'');
    const cluster=clusterBonus({...txn,filedDate,type},allTxns||[]);
    const timing=type==='Buy'?12:8;
    return {size,role,cluster,timing,total:Math.min(99,size+role+cluster+timing)};
  })();
  return{
    ...txn,
    id:txn.id,
    company:txn.company||company.name,
    market:txn.market||company.market,
    sector:txn.sector||company.sector,
    mcap:txn.mcap??company.mcap,
    title:txn.title||'Insider',
    type,
    filedDate,
    tradeDate:getTradeDate(txn),
    price:txn.price??null,
    shares:txn.shares??0,
    value:txn.value??0,
    isPolitician:!!txn.isPolitician,
    committee:txn.committee||null,
    chamber:txn.chamber||null,
    party:txn.party||null,
    isLive:!!txn.isLive,
    relationship:txn.relationship||(type==='Buy'?'Open Market Purchase':'Open Market Sale'),
    is10b51:!!txn.is10b51,
    shortInterest:txn.shortInterest??null,
    siTrend:txn.siTrend??null,
    unusualOptions:!!txn.unusualOptions,
    isForm144:!!txn.isForm144,
    earningsProximity:!!txn.earningsProximity,
    score,
    post30:txn.post30??performance.stock_1m??txn.ret1m??null,
    ret1w:txn.ret1w??performance.stock_1w??null,
    ret1m:txn.ret1m??performance.stock_1m??null,
    ret6m:txn.ret6m??performance.stock_6m??null,
    spark:txn.spark||spark(txn.post30??performance.stock_1m??0),
    performance,
  };
}

const RELATIONSHIPS_BUY=['Open Market Purchase','10b5-1 Plan Purchase','Direct Purchase','Stock Award Exercise','DRIP Purchase'];
const RELATIONSHIPS_SELL=['Open Market Sale','10b5-1 Plan Sale','Tax Withholding Sale','Planned Diversification','Option Exercise & Sale'];

const USING_DEMO_DATA=!(window.__VP_SNAPSHOT&&Array.isArray(window.__VP_SNAPSHOT.transactions)&&window.__VP_SNAPSHOT.transactions.length);

function makeTxns(){
  if(SNAPSHOT&&Array.isArray(SNAPSHOT.transactions)&&SNAPSHOT.transactions.length){
    const base=SNAPSHOT.transactions.map(t=>normalizeSnapshotTxn(t,SNAPSHOT.transactions));
    return base.sort((a,b)=>a.filedDate-b.filedDate||b.value-a.value);
  }
  const out=[];let id=0;
  COS.forEach(([t,co,mkt,sec,mcap])=>{
    const execList=EXECS[t]||[];
    const n=Math.min(execList.length,rnd(1,4));
    for(let i=0;i<n;i++){
      const[insider,title]=execList[i];
      const type=rng()<0.62?'Buy':'Sell';
      const basePrice=50+rng()*700;
      const shares=Math.round((20000+rng()*480000)*(mcap>1?1:0.4));
      const value=shares*basePrice;
      // Spread trades across last 18 months so history is meaningful
      const daysAgo=rnd(0,540);
      const sz=Math.min(35,Math.round(value/6e6));
      const roleW=/CEO|Founder|Chair/.test(title)?rnd(20,28):/CFO|President/.test(title)?rnd(14,20):rnd(6,12);
      const cluster=n>=2?rnd(10,20):rnd(0,5);
      const timing=rnd(4,16);
      const total=Math.min(99,sz+roleW+cluster+timing);
      // Only show returns for trades old enough to have data
      const has1w=daysAgo>=7, has1m=daysAgo>=30, has6m=daysAgo>=180;
      const post30=type==='Buy'?(rng()<0.62?rng()*0.28:-(rng()*0.12)):(rng()<0.55?-(rng()*0.18):rng()*0.10);
      const ret1w=has1w?(rng()-.44)*.06:null;
      const ret1m=has1m?(rng()-.42)*.12:null;
      const ret6m=has6m?(rng()-.40)*.28:null;
      // 10b5-1 flag: ~25% of buys are pre-planned (lower signal)
      const is10b51=type==='Buy'&&rng()<0.25;
      // Short interest % of float (5-40%)
      const shortInterest=+(5+rng()*35).toFixed(1);
      // SI trend: rising (building squeeze) or falling (unwinding)
      const siTrend=rng()<0.5?'rising':'falling';
      // Unusual options activity: call volume spike (~20% of buys)
      const unusualOptions=type==='Buy'&&rng()<0.20;
      // Form 144: planned sell (~30% of sells)
      const isForm144=type==='Sell'&&rng()<0.30;
      // Earnings proximity: within 30 days before earnings? (~18% of trades)
      const earningsProximity=rng()<0.18;
      out.push({id:++id,ticker:t,company:co,market:mkt,sector:sec,mcap,
        insider,title,isPolitician:false,committee:null,isLive:false,
        type,shares,price:+basePrice.toFixed(2),value:+value.toFixed(0),filedDate:daysAgo,
        score:{total,size:sz,role:roleW,cluster,timing},
        post30:+post30.toFixed(3),
        ret1w:ret1w!==null?+ret1w.toFixed(3):null,
        ret1m:ret1m!==null?+ret1m.toFixed(3):null,

function findClusters(txns){
  const pool=txns||TXNS;
  const map={};
  pool.filter(t=>t.type==='Buy'&&!t.isPolitician).forEach(t=>{(map[t.ticker]||=[]).push(t);});
  return Object.entries(map).filter(([_,a])=>{
    // Cluster = 2+ UNIQUE insiders within 30-day rolling window
    const sorted=[...a].sort((x,y)=>x.filedDate-y.filedDate);
    for(let i=0;i<sorted.length;i++){
      const window30=sorted.filter(t=>Math.abs((t.filedDate??0)-(sorted[i].filedDate??0))<=30);
      const uniq=new Set(window30.map(t=>t.insider));
      if(uniq.size>=2) return true;
    }
    return false;
  }).map(([ticker,arr])=>({
    ticker,
    txns:[...arr].sort((a,b)=>b.value-a.value),
    count:[...new Set(arr.map(t=>t.insider))].length,
    totalValue:arr.reduce((s,t)=>s+t.value,0),
  })).sort((a,b)=>b.totalValue-a.totalValue);
}
function sectorTotals(txns){

const fmt$=(n)=>{
  if(n===null||n===undefined||Number.isNaN(n)) return '—';
  const sign=n<0?'-':'';
  const abs=Math.abs(n);
  const body=abs>=1e9?(abs/1e9).toFixed(2)+'B':abs>=1e6?(abs/1e6).toFixed(1)+'M':abs>=1e3?Math.round(abs/1e3)+'K':Math.round(abs).toLocaleString();
  return sign+'$'+body;
};
const fmtShares=(n)=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':''+n;
const fmtPct=(n)=>n===null||n===undefined?'Pending':(n>=0?'+':'')+(n*100).toFixed(1)+'%';
const fmtDate=(d)=>d===0?'Today':d===1?'Yesterday':d<7?d+'d ago':d<14?'1 wk ago':Math.floor(d/7)+' wks ago';
const initials=(name)=>name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
function sparkPath(data,w,h,pad=2){
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
  const sx=(w-pad*2)/(data.length-1);
  return data.map((v,i)=>{const x=pad+i*sx;const y=pad+(h-pad*2)*(1-(v-mn)/rng);return(i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');
}
function calcWinRate(name,allTxns){
  const pool=allTxns||makeTxns();
  const buys=pool.filter(t=>t.insider===name&&t.type==='Buy');
  if(!buys.length)return null;
  // Use ret1m > 0 as win (positive return 1 month later)
  const withData=buys.filter(t=>t.ret1m!==null);
  if(!withData.length)return null;
  return Math.round(withData.filter(t=>t.ret1m>0).length/withData.length*100);
}
function makeOHLC(ticker,days=180){
  const real=getPriceSeries(ticker);
  if(real&&real.length){
    return real.slice(-days).map(([time,open,high,low,close,volume])=>({time,open,high,low,close,volume}));
  }
  let s=(ticker.charCodeAt(0)*31+ticker.length*17)%9999;
  const rr=()=>{s=(s*9301+49297)%233280;return s/233280;};
  let price=60+rr()*600;
  const out=[],now=new Date();
  for(let i=days-1;i>=0;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const vol=0.018+rr()*0.012,drift=(rr()-.46)*vol*price,open=price,close=+(open+drift).toFixed(2);
    const high=+Math.max(open,close,open+Math.abs(drift)*(0.6+rr())).toFixed(2);
    const low=+Math.min(open,close,open-Math.abs(drift)*(0.4+rr())).toFixed(2);
    out.push({time:d.toISOString().slice(0,10),open,high,low,close,volume:Math.round((300+rr()*1200)*1000)});
    price=close;
  }
  return out;
}
function makeMarkers(ticker){
  return TXNS.filter(t=>t.ticker===ticker).slice(0,6).map(t=>{

}

function getSignal(row,allTxns){
  if(!row) return {key:'routine',label:'Routine',score:38};
  // 10b5-1 pre-planned trades: downgrade to routine immediately
  if(row.is10b51&&row.type==='Buy') return {key:'routine',label:'Routine (10b5-1)',score:30,is10b51:true};
  if(row.isForm144) return {key:'bearish',label:'Form 144 (Planned Sell)',score:20,isForm144:true};
  let key;
  if(row.isPolitician) key='political';
  else if(row.type==='Sell') key=row.value>50e6?'bearish':'routine';
  else{
    const pct=row.value/1e6;
    const scoreVal=row.score&&row.score.total!=null?row.score.total:Math.min(99,Math.round(40+pct*0.8+(row.value>1e6?20:0)));
    if(pct>50&&/CEO|Founder|Chair/.test(row.title)) key='conviction';
    else if(pct>20) key='strategic';
    else if(scoreVal>65) key='opportunistic';
    else key='routine';
  }
  const meta=SIG_META[key]||SIG_META.routine;
  let score=meta.score;
  // Options activity boost
  const optBoost=row.unusualOptions?8:0;
  // Short interest boost (high SI + insider buy = squeeze setup)
  const siBoost=(row.shortInterest||0)>25?6:0;
  score=Math.min(99,score+optBoost+siBoost);
  return {key, label:meta.label, score, optBoost, siBoost, is10b51:false, isForm144:false};
}
// Conviction momentum: score trend across last 3 buys by same insider
function getConvictionMomentum(insider,allTxns){
  if(!allTxns) return null;
  const buys=allTxns.filter(t=>t.insider===insider&&t.type==='Buy'&&!t.is10b51).sort((a,b)=>b.filedDate-a.filedDate);
  if(buys.length<3) return null;
  const last3=buys.slice(-3);
  const scores=last3.map(t=>t.score&&t.score.total?t.score.total:50);
  const rising=scores[2]>scores[1]&&scores[1]>scores[0];
  const falling=scores[2]<scores[1]&&scores[1]<scores[0];
  const delta=scores[2]-scores[0];
  return {rising,falling,delta,scores};
}
// Time since last buy for an insider
function getTimeSinceLastBuy(insider,allTxns,currentTxnId){
  if(!allTxns) return null;
  const prevBuys=allTxns.filter(t=>t.insider===insider&&t.type==='Buy'&&t.id!==currentTxnId&&!t.is10b51).sort((a,b)=>a.filedDate-b.filedDate);
  if(!prevBuys.length) return null;
  const mostRecent=prevBuys[0];
  return mostRecent.filedDate; // daysAgo of their previous buy
}
// Consensus score: aggregate signal across all insiders for a ticker (higher = stronger crowd conviction)
function getConsensusScore(ticker,allTxns){
  const buys=allTxns.filter(t=>t.ticker===ticker&&t.type==='Buy'&&!t.isPolitician&&!t.is10b51);
  if(!buys.length) return null;
  const uniqueInsiders=new Set(buys.map(t=>t.insider)).size;
  const totalValue=buys.reduce((s,t)=>s+t.value,0);
  const avgSig=buys.reduce((s,t)=>s+getSignal(t).score,0)/buys.length;
  // Score 0-100: weighted by unique insiders, value, signal quality
  const raw=Math.min(99,Math.round(avgSig*0.5 + Math.min(30,uniqueInsiders*10) + Math.min(20,totalValue/5e6)));
  return {score:raw, insiders:uniqueInsiders, totalValue, buys:buys.length};
}
// Whale detector: is this trade >3x the insider's personal historical average?
function isWhale(txn,allTxns){
  const prev=allTxns.filter(t=>t.insider===txn.insider&&t.type==='Buy'&&t.id!==txn.id&&!t.is10b51);
  if(prev.length<2) return false;
  const avg=prev.reduce((s,t)=>s+t.value,0)/prev.length;
  return txn.value>avg*3;
}
// Max drawdown from an array of cumulative return values
function maxDrawdown(cumulativeReturns){
  let peak=1,maxDD=0;
  for(const r of cumulativeReturns){
    if(r>peak) peak=r;
    const dd=(peak-r)/peak;
    if(dd>maxDD) maxDD=dd;
  }
  return maxDD;
}

// ── ALPHA SIGNAL ENGINE ─────────────────────────────────────────────────────
// Market-relative excess return: did the insider's stock outperform its sector?
// Snapshot builds can provide exact stock, sector, home-market, and peer returns.
const SECTOR_ETFS={
  Technology:'XLK',Financials:'XLF',Healthcare:'XLV',Energy:'XLE',
  Industrials:'XLI',Consumer:'XLY',Communication:'XLC',
  Utilities:'XLU','Real Estate':'XLRE','Consumer Staples':'XLP',
  Materials:'XLB',Defense:'ITA',Pharmaceutical:'XPH',Semiconductor:'SOXX',
};
const MARKET_ETFS=SNAPSHOT&&SNAPSHOT.marketEtfs?SNAPSHOT.marketEtfs:{US:'SPY',EU:'VGK'};
// Given a transaction, compute alpha vs sector for each window
function getAlpha(txn){
  const comp=getCompany(txn.ticker)||{};
  const sector=(comp.sector||txn.sector)||'Technology';
  const market=(comp.market||txn.market)||'US';
  const perf=txn.performance||{};
  const stockRet1w=txn.ret1w??perf.stock_1w??null;
  const stockRet1m=txn.ret1m??perf.stock_1m??null;
  const stockRet6m=txn.ret6m??perf.stock_6m??null;
  const sector1w=perf.sector_1w??null, sector1m=perf.sector_1m??null, sector6m=perf.sector_6m??null;
  const market1w=perf.market_1w??null, market1m=perf.market_1m??null, market6m=perf.market_6m??null;
  const peer1w=perf.peers_1w??null, peer1m=perf.peers_1m??null, peer6m=perf.peers_6m??null;
  return {
    alpha1w: perf.alphaSector_1w??(stockRet1w!==null&&sector1w!==null?stockRet1w-sector1w:null),
    alpha1m: perf.alphaSector_1m??(stockRet1m!==null&&sector1m!==null?stockRet1m-sector1m:null),
    alpha6m: perf.alphaSector_6m??(stockRet6m!==null&&sector6m!==null?stockRet6m-sector6m:null),
    alphaMarket1w: perf.alphaMarket_1w??(stockRet1w!==null&&market1w!==null?stockRet1w-market1w:null),
    alphaMarket1m: perf.alphaMarket_1m??(stockRet1m!==null&&market1m!==null?stockRet1m-market1m:null),
    alphaMarket6m: perf.alphaMarket_6m??(stockRet6m!==null&&market6m!==null?stockRet6m-market6m:null),
    alphaPeers1w: perf.alphaPeers_1w??(stockRet1w!==null&&peer1w!==null?stockRet1w-peer1w:null),
    alphaPeers1m: perf.alphaPeers_1m??(stockRet1m!==null&&peer1m!==null?stockRet1m-peer1m:null),
    alphaPeers6m: perf.alphaPeers_6m??(stockRet6m!==null&&peer6m!==null?stockRet6m-peer6m:null),
    ret1w: stockRet1w, ret1m: stockRet1m, ret6m: stockRet6m,
    mkt1w: sector1w, mkt1m: sector1m, mkt6m: sector6m,
    market1w, market1m, market6m,
    peer1w, peer1m, peer6m,
    sector,
    market,
    sectorEtf: perf.sectorEtf||SECTOR_ETFS[sector]||'SPY',
    marketEtf: perf.marketEtf||MARKET_ETFS[market]||'SPY',
    peerTickers: perf.peerTickers||getPeerTickers(txn.ticker),
  };
}
// Classify signal strength: needs meaningful ALPHA not just absolute return
function alphaLabel(alpha){
  if(alpha===null||alpha===undefined) return {label:'Pending',color:'#8a8174',bg:'#f5f3ee'};
  const pct=alpha*100;
  if(pct>10) return {label:'Strong Alpha',color:'#1a6e3c',bg:'#d4edda'};
  if(pct>4)  return {label:'Positive Alpha',color:'#2e7d4f',bg:'#e8f5e9'};
  if(pct>0)  return {label:'Slight Edge',color:'#5a7a6a',bg:'#f0f7f2'};
  if(pct>-4) return {label:'In-Line',color:'#7a7060',bg:'#f5f3ee'};
  return {label:'Underperformed',color:'#a32a2a',bg:'#fce8e8'};
}

function TapeTable({txns,onOpenInsider,onOpenCompany}){
  const [sort,setSort]=React.useState({k:'filedDate',dir:1});
  const [page,setPage]=React.useState(0);
  const [filter,setFilter]=React.useState('All');
  const PAGE=20;
  const filtered=txns.filter(t=>filter==='All'||t.type===filter);
  const sorted=[...filtered].sort((a,b)=>{
    let av=a[sort.k],bv=b[sort.k];
    if(sort.k==='alpha'){av=getAlpha(a).alpha1m;bv=getAlpha(b).alpha1m;}
    if(sort.k==='score'){av=getSignal(a).score;bv=getSignal(b).score;}
    return sort.dir*(av>bv?1:av<bv?-1:0);
  });
  const pages=Math.ceil(sorted.length/PAGE);
  const slice=sorted.slice(page*PAGE,(page+1)*PAGE);
  function colClick(k){setSort(s=>({k,dir:s.k===k?-s.dir:-1}));setPage(0);}
  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)'}}>FILTER</div>
        {['All','Buy','Sell'].map(f=>(
          <button key={f} className={'chip'+(filter===f?' chip-active':'')} onClick={()=>{setFilter(f);setPage(0);}}>{f}</button>
        ))}
        <span style={{marginLeft:'auto',fontSize:11,color:'var(--ink-soft)'}}>{filtered.length} transactions</span>
      </div>
      <div style={{overflowX:'auto'}}>
        <table className="tape-table">
          <thead>
            <tr>
              {TAPE_COLS.map(c=>(
                <th key={c.k} onClick={()=>colClick(c.k)} style={{cursor:'pointer',userSelect:'none',whiteSpace:'nowrap'}}>
                  {c.label}{sort.k===c.k?(sort.dir===1?' ↑':' ↓'):''}
                </th>
              ))}
              <th>Live</th>
            </tr>
          </thead>
          <tbody>
            {slice.map(t=>(
              <tr key={t.id} onClick={()=>onOpenInsider(t)} style={{cursor:'pointer'}}>
                {TAPE_COLS.map(c=><td key={c.k}>{c.fmt(t)}</td>)}
                <td>{t.isLive?<span className="live-pill">LIVE</span>:null}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {pages>1&&<div style={{display:'flex',gap:6,marginTop:12,justifyContent:'center',flexWrap:'wrap'}}>
        <button className="chip" onClick={()=>setPage(p=>Math.max(0,p-1))} disabled={page===0}>← Prev</button>
        {Array.from({length:Math.min(pages,8)},(_,i)=>(
          <button key={i} className={'chip'+(page===i?' chip-active':'')} onClick={()=>setPage(i)}>{i+1}</button>
        ))}
        <button className="chip" onClick={()=>setPage(p=>Math.min(pages-1,p+1))} disabled={page===pages-1}>Next →</button>
      </div>}
    </div>
  );
}

// ── TRACK RECORD PAGE ──────────────────────────────────────────────────────
function TrackRecordPage(){
  const ref=React.useRef();
  const allTxns=makeTxns();
  const buys=allTxns.filter(t=>t.type==='Buy'&&t.ret6m!==null&&t.ret6m!==undefined);
  const convBuys=buys.filter(t=>getSignal(t).key==='conviction').sort((a,b)=>b.filedDate-a.filedDate);
  const benchmarkReturns=convBuys.map(t=>getAlpha(t).market6m??getAlpha(t).mkt6m??0);
  let portCum=1,spCum=1;
  const portPoints=[{t:0,port:0,sp:0,label:'Start'}];
  convBuys.forEach((txn,i)=>{
    const ret=txn.ret6m||0;
    const spRet=benchmarkReturns[i]||0;
    portCum*=(1+ret);spCum*=(1+spRet);
    const alpha=getAlpha(txn);
    portPoints.push({t:i+1,time:getTradeDate(txn),port:(portCum-1)*100,sp:(spCum-1)*100,label:txn.ticker,alpha1m:alpha.alpha1m,ret});
  });
  const finalAlpha=(portCum-spCum)*100;
  const buysWithAlphaData=buys.filter(t=>getAlpha(t).alpha1m!==null);
  const buysWithAlpha=buysWithAlphaData.filter(t=>getAlpha(t).alpha1m>0);
  const winRate=buysWithAlphaData.length>0?Math.round(buysWithAlpha.length/buysWithAlphaData.length*100):0;
  const buysWithAlphaArr=buys.filter(t=>getAlpha(t).alpha1m!==null);
  const avgAlpha=buysWithAlphaArr.length?buysWithAlphaArr.reduce((s,t)=>s+getAlpha(t).alpha1m,0)/buysWithAlphaArr.length*100:0;
  // Simple Sharpe approximation
  const returns=convBuys.map(t=>t.ret6m||0);
  const mean=returns.reduce((s,r)=>s+r,0)/Math.max(returns.length,1);
  const variance=returns.reduce((s,r)=>s+Math.pow(r-mean,2),0)/Math.max(returns.length,1);
  const sharpe=(mean/(Math.sqrt(variance)+0.001)*Math.sqrt(252/180)).toFixed(2);

  React.useEffect(()=>{
    if(!ref.current||portPoints.length<2) return;
    const el=ref.current;
    el.innerHTML='';
    const isDark=document.querySelector('.vp')?.classList.contains('dark');
    const bg=isDark?'#211d18':'#fffdf7';
    const textCol=isDark?'#c8b89a':'#3d3628';
    const gridCol=isDark?'rgba(255,255,255,0.05)':'rgba(26,22,18,0.05)';
    const borderCol=isDark?'#3a342c':'#ccc4b4';
    const chart=LightweightCharts.createChart(el,{
      width:el.offsetWidth||700,height:260,
      layout:{background:{type:'solid',color:bg},textColor:textCol,fontFamily:'JetBrains Mono,monospace',fontSize:11},
      grid:{vertLines:{color:gridCol},horzLines:{color:gridCol}},
      rightPriceScale:{borderColor:borderCol,scaleMargins:{top:0.08,bottom:0.06}},
      timeScale:{borderColor:borderCol,fixLeftEdge:true,fixRightEdge:true,timeVisible:false},
      crosshair:{mode:1},
    });
    const portSeries=chart.addLineSeries({color:'#2e7d4f',lineWidth:2.5,title:'Conviction Portfolio',priceLineVisible:false});
    const spSeries=chart.addLineSeries({color:'#7a9cc2',lineWidth:1.5,lineStyle:2,title:'Market Benchmark',priceLineVisible:false});
    // Generate strictly ascending unique dates — LightweightCharts requires no duplicates
    const baseDate=new Date('2023-01-01');
    const seen=new Set();
    function uniqueDate(i){
      let d=new Date(baseDate);
      d.setDate(d.getDate()+i*14);
      let s=d.toISOString().slice(0,10);
      while(seen.has(s)){d.setDate(d.getDate()+1);s=d.toISOString().slice(0,10);}
      seen.add(s);return s;
    }
    const portData=portPoints.map((p,i)=>({time:uniqueDate(i),value:parseFloat(p.port.toFixed(4))||0}));
    const seen2=new Set();
    function uniqueDate2(i){
      let d=new Date(baseDate);
      d.setDate(d.getDate()+i*14);
      let s=d.toISOString().slice(0,10);
      while(seen2.has(s)){d.setDate(d.getDate()+1);s=d.toISOString().slice(0,10);}
      seen2.add(s);return s;
    }
    const spData=portPoints.map((p,i)=>({time:uniqueDate2(i),value:parseFloat(p.sp.toFixed(4))||0}));
    portSeries.setData(portData);spSeries.setData(spData);
    chart.timeScale().fitContent();
    const obs=new ResizeObserver(()=>chart.applyOptions({width:el.offsetWidth}));
    obs.observe(el);
    return()=>{obs.disconnect();chart.remove();};
  },[]);

  return (
    <div>
      <div style={{marginBottom:20}}>
        <div style={{fontFamily:'var(--font-serif)',fontSize:26,fontWeight:800,color:'var(--ink)',marginBottom:4}}>Track Record</div>
        <div style={{fontSize:13,color:'var(--ink-soft)'}}>Snapshot backtest using actual post-trade returns in the current dataset. Each conviction buy is compared against its home-market ETF over the same 6-month window.</div>
      </div>
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(5,1fr)',marginBottom:20}}>
        <div className="stat-box"><div className="stat-box-l">Trades</div><div className="stat-box-v">{convBuys.length}</div></div>
        <div className="stat-box"><div className="stat-box-l">Win Rate (alpha)</div><div className="stat-box-v" style={{color:winRate>=60?'var(--buy)':'var(--sell)'}}>{winRate}%</div></div>
        <div className="stat-box"><div className="stat-box-l">Avg Alpha (1M)</div><div className="stat-box-v" style={{color:avgAlpha>=0?'var(--buy)':'var(--sell)'}}>{avgAlpha>=0?'+':''}{avgAlpha.toFixed(1)}%</div></div>
        <div className="stat-box"><div className="stat-box-l">Portfolio vs Market</div><div className="stat-box-v" style={{color:finalAlpha>=0?'var(--buy)':'var(--sell)'}}>{finalAlpha>=0?'+':''}{finalAlpha.toFixed(1)}%</div></div>
        <div className="stat-box"><div className="stat-box-l">Sharpe Ratio</div><div className="stat-box-v" style={{color:parseFloat(sharpe)>=1?'var(--buy)':'var(--ink)'}}>{sharpe}</div></div>
      </div>
      <div style={{background:'#fffdf7',border:'1px solid var(--rule-soft)',borderRadius:8,padding:'16px',marginBottom:20}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginBottom:10}}>Cumulative Return — Conviction Portfolio vs Home-Market ETF Basket</div>
        <div ref={ref} style={{width:'100%',height:260}}/>
        <div style={{display:'flex',gap:16,marginTop:8,fontSize:11,color:'var(--ink-soft)'}}>
          <span style={{color:'#2e7d4f',fontWeight:600}}>— Conviction Buy Portfolio</span>
          <span style={{color:'#7a9cc2',fontWeight:600}}>— Market ETF Benchmark</span>
        </div>
      </div>
      <div style={{background:'var(--bg-soft)',border:'1px solid var(--rule-soft)',borderRadius:8,padding:'16px',marginBottom:20}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginBottom:12}}>Per-Trade Alpha Breakdown</div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {convBuys.slice(0,12).map(t=>{
            const a=getAlpha(t);const al=alphaLabel(a.alpha1m);
            return (
              <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'6px 10px',background:'var(--bg)',border:'1px solid var(--rule-soft)',borderRadius:5}}>
                <span style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:12,minWidth:48,color:'var(--buy)'}}>{t.ticker}</span>

        <div className="ai-box-hd"><span>⬡</span> Academic Foundation</div>

        <div className="ai-bullets">
          <div className="ai-bullet"><strong>Jeng, Metrick & Zeckhauser (2003)</strong> — "Estimating the Returns to Insider Trading": Insider purchases earn abnormal returns of ~6% in the 6 months following the trade, far exceeding sells.</div>
          <div className="ai-bullet"><strong>Lakonishok & Lee (2001)</strong> — "Are Insider Trades Informative?": Small-company insider buys are the most informative signal, predicting 12-month outperformance.</div>
          <div className="ai-bullet"><strong>Cohen, Malloy & Pomorski (2012)</strong> — "Decoding Inside Information": "Routine" insider trades (scheduled/repeated patterns) carry no information; only "opportunistic" trades predict future returns.</div>

  );
}

function App(){
  const allTxns=React.useMemo(()=>makeTxns(),[]);
  const [page,setPage]=React.useState('tape');
  const [search,setSearch]=React.useState('');
  const [selectedInsider,setSelectedInsider]=React.useState(null);
  const [selectedCompany,setSelectedCompany]=React.useState(null);
  const [edgarLive,setEdgarLive]=React.useState(false);
  const [darkMode,setDarkMode_]=React.useState(()=>getDarkMode());
  const [authOpen,setAuthOpen]=React.useState(false);
  const [authUser,setAuthUser]=React.useState(null); // {email, name}
  const searchRef=React.useRef();

  // Apply dark mode class to root
  React.useEffect(()=>{
    const root=document.querySelector('.vp');
    if(root){root.classList.toggle('dark',darkMode);}
    setDarkMode(darkMode);
  },[darkMode]);

  // Focus top-ranked ticker for the right panel
  const buys=allTxns.filter(t=>t.type==='Buy');
  const coreBuys=buys.filter(t=>!t.isPolitician);
  const tickerVolume=coreBuys.reduce((acc,t)=>{acc[t.ticker]=(acc[t.ticker]||0)+t.value;return acc;},{});
  const topTickers=Object.entries(tickerVolume).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t])=>t);
  const [focusTicker,setFocusTicker]=React.useState(topTickers[0]||'NVDA');

  // Live EDGAR fetch
  React.useEffect(()=>{
    fetchLiveEdgar().then(()=>setEdgarLive(!!window.__edgarLive));
  },[]);

  // Keyboard shortcuts
  React.useEffect(()=>{
    function onKey(e){
      if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
      if(selectedInsider||selectedCompany){
        if(e.key==='Escape'){setSelectedInsider(null);setSelectedCompany(null);}
        return;
      }
      if(e.key==='/')  {e.preventDefault();searchRef.current&&searchRef.current.focus();}
      if(e.key==='t')  setPage('tape');
      if(e.key==='p')  setPage('politicians');
      if(e.key==='c')  setPage('clusters');
      if(e.key==='d')  setPage('deepdive');
      if(e.key==='w')  setPage('watchlist');
      if(e.key==='Escape') setSearch('');
    }
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[selectedInsider,selectedCompany]);

  // Filtered txns
  const filtered=React.useMemo(()=>{
    const q=search.toLowerCase();
    if(!q) return allTxns;
    return allTxns.filter(t=>t.ticker.toLowerCase().includes(q)||t.insider.toLowerCase().includes(q)||t.title.toLowerCase().includes(q));
  },[search,allTxns]);

  // Clusters
  const clusters=findClusters(allTxns);

  // Watchlist favs
  const favInsiders=getFavs('i');
  const favTickers=getFavs('t');
  const watchlistInsiders=[...new Set(allTxns.filter(t=>favInsiders.includes(t.insider)).map(t=>t.insider))];
  const watchlistTickers=[...new Set(allTxns.filter(t=>favTickers.includes(t.ticker)).map(t=>t.ticker))];

  // Sector totals
  const sectors=sectorTotals(allTxns);

  // KPIs
  const totalBuyVol=buys.reduce((s,t)=>s+t.value,0);
  const sells=allTxns.filter(t=>t.type==='Sell');
  const totalSellVol=sells.reduce((s,t)=>s+t.value,0);
  const posAlpha=buys.filter(t=>getAlpha(t).alpha1m>0);
  const alphaWinRate=buys.length>0?Math.round(posAlpha.length/buys.length*100):0;
  const liveStats={
    txnCount:allTxns.length,
    clusterCount:clusters.length,
    politicianCount:allTxns.filter(t=>t.isPolitician).length,
  };

  // Politicians
  const polTxns=allTxns.filter(t=>t.isPolitician);
  const politicianProfiles=[...new Set(polTxns.map(t=>t.insider))].map(name=>{
    const txns=polTxns.filter(t=>t.insider===name);
    const meta=getPolitician(name)||{name,chamber:txns[0]&&txns[0].chamber||'Disclosure',party:txns[0]&&txns[0].party||'—',state:'US',committee:txns[0]&&txns[0].committee||'House disclosure'};
    return {
      ...meta,
      txns,
      buyV:txns.filter(t=>t.type==='Buy').reduce((s,t)=>s+t.value,0),
      latestFiled:Math.min(...txns.map(t=>t.filedDate)),
    };
  }).sort((a,b)=>b.buyV-a.buyV||a.latestFiled-b.latestFiled);

    acc[t.sector]=(acc[t.sector]||0)+t.value;
    return acc;
  },{});

    {k:'clusters',label:'Clusters',shortcut:'C'},

    {k:'portfolio',label:'Signal Portfolio'},
    {k:'heatmap',label:'Sector Heatmap'},
    {k:'earnings',label:'Earnings'},
    {k:'myportfolio',label:'My Portfolio 💼'},
    {k:'watchlist',label:'Watchlist ★',shortcut:'W'},
    {k:'trackrecord',label:'Track Record'},
    {k:'methodology',label:'Methodology'},
    {k:'about',label:'About'},

    <div className="vp" style={{minHeight:'100vh',background:'var(--bg)',display:'flex',flexDirection:'column'}}>

          Vantage<span style={{color:'#e8b84b'}}>Point</span>
        </div>
        <div style={{display:'flex',gap:0,flex:1,overflowX:'auto'}}>
          {PAGES.map(pg=>(
            <button key={pg.k} onClick={()=>setPage(pg.k)} style={{background:'none',border:'none',color:page===pg.k?'#e8b84b':'rgba(255,255,255,0.75)',fontFamily:'var(--font-sans)',fontSize:12,fontWeight:600,padding:'14px 14px',cursor:'pointer',borderBottom:page===pg.k?'2px solid #e8b84b':'2px solid transparent',whiteSpace:'nowrap',transition:'color 0.15s'}}>

            </button>
          ))}
        </div>
        {SNAPSHOT_META&&<span className="live-pill" style={{marginLeft:12}}>SNAPSHOT {new Date(SNAPSHOT_META.builtAt).toISOString().slice(0,10)}</span>}
        <div style={{display:'flex',alignItems:'center',background:'rgba(255,255,255,0.1)',borderRadius:6,padding:'4px 10px',marginLeft:12,flexShrink:0}}>
          <span style={{color:'rgba(255,255,255,0.5)',fontSize:13,marginRight:6}}>🔍</span>
          <input ref={searchRef} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search… [/]" style={{background:'none',border:'none',color:'#fff',fontFamily:'var(--font-sans)',fontSize:12,outline:'none',width:140}} onKeyDown={e=>{if(e.key==='Escape'){setSearch('');e.target.blur();}}}/>
        </div>
        {/* Dark mode toggle */}
        <button onClick={()=>setDarkMode_(!darkMode)} title="Toggle dark mode" style={{background:'none',border:'1px solid rgba(255,255,255,0.2)',color:'rgba(255,255,255,0.7)',width:32,height:32,cursor:'pointer',fontSize:14,marginLeft:8,flexShrink:0,borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center'}}>
          {darkMode?'☀':'🌙'}

              <div style={{fontFamily:'var(--font-serif)',fontSize:32,fontWeight:900,color:'var(--ink)',letterSpacing:'-1px'}}>The Tape</div>

// ── CSV EXPORT ───────────────────────────────────────────────────────────
function exportCSV(txns,filename='vantagepoint-tape.csv'){
  const header=['Date','Ticker','Company','Insider','Title','Type','Shares','Price','Value','Signal','Score','1W Return','1M Return','6M Return','Short Interest','10b5-1','Form144','Unusual Options','Earnings Proximity'];
  const rows=txns.map(t=>{
    const sig=getSignal(t);
    return [
      fmtDate(t.filedDate),t.ticker,t.company,t.insider,t.title,t.type,
      t.shares,t.price,t.value,sig.label,sig.score,
      t.ret1w!==null?fmtPct(t.ret1w):'Pending',
      t.ret1m!==null?fmtPct(t.ret1m):'Pending',
      t.ret6m!==null?fmtPct(t.ret6m):'Pending',
      t.shortInterest+'%',t.is10b51?'Yes':'No',t.isForm144?'Yes':'No',
      t.unusualOptions?'Yes':'No',t.earningsProximity?'Yes':'No',
    ].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',');
  });
  const blob=new Blob([[header.join(','),...rows].join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
}

// ── ALPHA BEAT BANNER — market-beating highlight bar ──────────────────────
function AlphaBeatBanner({txn}){
  const alpha=getAlpha(txn);
  const best=[
    {label:'1W',val:alpha.alpha1w,ret:alpha.ret1w,mkt:alpha.mkt1w},
    {label:'1M',val:alpha.alpha1m,ret:alpha.ret1m,mkt:alpha.mkt1m},
    {label:'6M',val:alpha.alpha6m,ret:alpha.ret6m,mkt:alpha.mkt6m},
  ].filter(r=>r.val!==null);
  if(!best.length) return null;
  const beats=best.filter(r=>r.val>0);
  if(!beats.length) return null;
  const top=beats.sort((a,b)=>b.val-a.val)[0];
  const pct=(top.val*100).toFixed(1);
  return (
    <div style={{background:'linear-gradient(90deg,#1a4a2e,#2a6a44)',borderRadius:6,padding:'10px 14px',display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
      <span style={{fontSize:20}}>🏆</span>
      <div>
        <div style={{fontSize:12,fontWeight:800,color:'#7dffb3',letterSpacing:'.3px'}}>BEATS THE MARKET — +{pct}% alpha over {top.label}</div>
        <div style={{fontSize:11,color:'rgba(255,255,255,0.7)',marginTop:2}}>
          Stock: <span style={{fontWeight:700,color:'#7dffb3'}}>{top.ret>=0?'+':''}{(top.ret*100).toFixed(1)}%</span> vs sector ETF: <span style={{fontWeight:600,color:'rgba(255,255,255,0.5)'}}>{top.mkt>=0?'+':''}{(top.mkt*100).toFixed(1)}%</span> — insider signal outperformed
        </div>
      </div>
    </div>
  );
}

}

// ── SECTOR ROTATION HEATMAP PAGE ─────────────────────────────────────────
function SectorHeatmapPage({allTxns,onPageChange}){
  // Compute net flow per sector
  const map={};
  allTxns.filter(t=>!t.is10b51).forEach(t=>{
    const sector=(getCompany(t.ticker)||{sector:t.sector||'Other'}).sector||'Other';
    if(!map[sector]) map[sector]={sector,buyVol:0,sellVol:0,buys:0,sells:0,tickers:new Set(),topBuy:null};
    if(t.type==='Buy'){map[sector].buyVol+=t.value;map[sector].buys++;if(!map[sector].topBuy||t.value>map[sector].topBuy.value)map[sector].topBuy=t;}
    else{map[sector].sellVol+=t.value;map[sector].sells++;}
    map[sector].tickers.add(t.ticker);
  });
  const sectors=Object.values(map).map(s=>({...s,net:s.buyVol-s.sellVol,ratio:s.sellVol>0?s.buyVol/s.sellVol:s.buyVol>0?99:1})).sort((a,b)=>b.net-a.net);
  const maxAbs=Math.max(...sectors.map(s=>Math.abs(s.net)),1);

  return (
    <div>
      <div style={{marginBottom:20}}>
        <div style={{fontFamily:'var(--font-serif)',fontSize:28,fontWeight:900,color:'var(--ink)',letterSpacing:'-0.5px'}}>Sector Rotation</div>
        <div style={{fontSize:13,color:'var(--ink-soft)',marginTop:2}}>Net insider buy vs sell flow by sector — excludes 10b5-1 pre-planned trades. Brighter green = stronger conviction buying.</div>
      </div>
      {/* Heatmap grid */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:24}}>
        {sectors.map(s=>{
          const intensity=Math.abs(s.net)/maxAbs;
          const isBuy=s.net>0;
          const bg=isBuy
            ?`rgba(46,125,79,${0.08+intensity*0.45})`
            :`rgba(163,42,42,${0.08+intensity*0.45})`;
          const border=isBuy?`rgba(46,125,79,${0.3+intensity*0.5})`:`rgba(163,42,42,${0.3+intensity*0.5})`;
          return (
            <div key={s.sector} className="heatmap-cell" style={{background:bg,border:`1.5px solid ${border}`}} onClick={()=>onPageChange&&onPageChange('tape',s.sector)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                <div style={{fontWeight:700,fontSize:13,color:'var(--ink)'}}>{s.sector}</div>
                <div style={{fontFamily:'var(--font-mono)',fontWeight:900,fontSize:15,color:isBuy?'var(--buy)':'var(--sell)'}}>{isBuy?'+':''}{fmt$(s.net)}</div>
              </div>
              <div style={{display:'flex',gap:10,marginBottom:8}}>
                <span style={{fontSize:11,color:'var(--buy)',fontWeight:600}}>▲ {s.buys} buys {fmt$(s.buyVol)}</span>
                <span style={{fontSize:11,color:'var(--sell)',fontWeight:600}}>▼ {s.sells} sells</span>
              </div>
              {/* Flow bar */}
              <div style={{height:4,background:'rgba(0,0,0,0.08)',borderRadius:2,overflow:'hidden',marginBottom:8}}>
                <div style={{height:'100%',width:(intensity*100)+'%',background:isBuy?'var(--buy)':'var(--sell)',borderRadius:2}}/>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontSize:10,color:'var(--ink-soft)'}}>{s.tickers.size} companies · {SECTOR_ETFS[s.sector]||'SPY'}</div>
                {s.topBuy&&<div style={{fontSize:10,color:'var(--ink-soft)'}}>Top: <strong>{s.topBuy.ticker}</strong></div>}
              </div>
            </div>
          );
        })}
      </div>
      {/* Bar chart summary */}
      <div style={{background:'var(--bg-soft)',border:'1px solid var(--rule-soft)',borderRadius:8,padding:'16px'}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginBottom:12}}>Net Flow Ranking</div>
        {sectors.map(s=>{
          const isBuy=s.net>0;
          const w=Math.abs(s.net)/maxAbs*100;
          return (
            <div key={s.sector} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
              <div style={{fontSize:11,fontWeight:600,color:'var(--ink)',minWidth:160}}>{s.sector}</div>
              <div style={{flex:1,height:16,background:'var(--bg)',borderRadius:3,overflow:'hidden',position:'relative'}}>
                <div style={{position:'absolute',...(isBuy?{left:'50%',width:(w/2)+'%'}:{right:'50%',width:(w/2)+'%'}),top:0,bottom:0,background:isBuy?'var(--buy)':'var(--sell)',opacity:0.75}}/>
                <div style={{position:'absolute',left:'50%',top:0,bottom:0,width:1,background:'var(--rule-soft)'}}/>
              </div>
              <div style={{fontFamily:'var(--font-mono)',fontSize:11,fontWeight:700,color:isBuy?'var(--buy)':'var(--sell)',minWidth:80,textAlign:'right'}}>{isBuy?'+':''}{fmt$(s.net)}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── EQUITY CURVE SVG ─────────────────────────────────────────────────────
function EquityCurveSVG({portfolioRets,benchmarkRets,width=640,height=200}){
  if(!portfolioRets||!portfolioRets.length) return null;
  const padL=52,padR=16,padT=14,padB=28;
  const W=width,H=height;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  // Build cumulative series
  const portCum=[1],mktCum=[1];
  portfolioRets.forEach(r=>{portCum.push(portCum[portCum.length-1]*(1+(r||0)));});
  benchmarkRets.forEach(r=>{mktCum.push(mktCum[mktCum.length-1]*(1+(r||0)));});
  const n=Math.max(portCum.length,mktCum.length);
  const allVals=[...portCum,...mktCum].filter(v=>isFinite(v));
  if(!allVals.length) return null;
  const minV=Math.min(...allVals)*0.97, maxV=Math.max(...allVals)*1.03;
  const scaleX=(i)=>padL+innerW*i/(n-1||1);
  const scaleY=(v)=>padT+innerH*(1-(v-minV)/(maxV-minV||1));
  const portPath=portCum.map((v,i)=>(i===0?'M':'L')+scaleX(i).toFixed(1)+','+scaleY(v).toFixed(1)).join(' ');
  const mktPath=mktCum.map((v,i)=>(i===0?'M':'L')+scaleX(i).toFixed(1)+','+scaleY(v).toFixed(1)).join(' ');
  const lastPort=portCum[portCum.length-1];
  const lastMkt=mktCum[mktCum.length-1];
  const portColor=lastPort>=1?'#2e7d4f':'#a32a2a';
  // Y axis ticks
  const pctRange=[(maxV-1)*100,(minV-1)*100];
  const tickStep=Math.abs(pctRange[0]-pctRange[1])>40?10:Math.abs(pctRange[0]-pctRange[1])>20?5:2;
  const tickMin=Math.ceil(pctRange[1]/tickStep)*tickStep;
  const tickMax=Math.floor(pctRange[0]/tickStep)*tickStep;
  const yTicks=[];for(let t=tickMin;t<=tickMax;t+=tickStep)yTicks.push(t);
  // X axis labels (trade index)
  const xTicks=n>10?[0,Math.floor(n/4),Math.floor(n/2),Math.floor(3*n/4),n-1]:[...Array(n).keys()];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      {/* Grid lines */}
      {yTicks.map(t=>{
        const yv=scaleY(1+t/100);
        return <g key={t}>
          <line x1={padL} y1={yv} x2={W-padR} y2={yv} stroke={t===0?'rgba(0,0,0,0.2)':'rgba(0,0,0,0.06)'} strokeWidth={t===0?1.5:1} strokeDasharray={t===0?'4,3':'3,4'}/>
          <text x={padL-5} y={yv+4} textAnchor="end" fontSize={9} fill="#8a8174" fontFamily="JetBrains Mono,monospace">{t>=0?'+':''}{t}%</text>
        </g>;
      })}
      {/* X axis baseline */}
      <line x1={padL} y1={H-padB} x2={W-padR} y2={H-padB} stroke="rgba(0,0,0,0.15)" strokeWidth={1}/>
      {/* X ticks */}
      {xTicks.map(i=>(
        <text key={i} x={scaleX(i)} y={H-padB+12} textAnchor="middle" fontSize={9} fill="#8a8174" fontFamily="JetBrains Mono,monospace">T{i+1}</text>
      ))}
      {/* Benchmark area fill */}
      <path d={mktPath+` L${scaleX(mktCum.length-1)},${H-padB} L${scaleX(0)},${H-padB} Z`} fill="rgba(122,156,194,0.06)"/>
      {/* Benchmark line */}
      <path d={mktPath} fill="none" stroke="#7a9cc2" strokeWidth={1.5} strokeDasharray="5,3" opacity={0.8}/>
      {/* Portfolio area fill */}
      <path d={portPath+` L${scaleX(portCum.length-1)},${scaleY(minV)} L${scaleX(0)},${scaleY(minV)} Z`} fill={lastPort>=1?'rgba(46,125,79,0.1)':'rgba(163,42,42,0.08)'}/>
      {/* Portfolio line */}
      <path d={portPath} fill="none" stroke={portColor} strokeWidth={2.5}/>
      {/* End dot + label */}
      <circle cx={scaleX(portCum.length-1)} cy={scaleY(lastPort)} r={4} fill={portColor}/>
      <text x={scaleX(portCum.length-1)-6} y={scaleY(lastPort)-8} textAnchor="end" fontSize={10} fontWeight={700} fill={portColor} fontFamily="JetBrains Mono,monospace">{lastPort>=1?'+':''}{((lastPort-1)*100).toFixed(1)}%</text>
      <circle cx={scaleX(mktCum.length-1)} cy={scaleY(lastMkt)} r={3} fill="#7a9cc2"/>
      <text x={scaleX(mktCum.length-1)-6} y={scaleY(lastMkt)+14} textAnchor="end" fontSize={9} fill="#7a9cc2" fontFamily="JetBrains Mono,monospace">{lastMkt>=1?'+':''}{((lastMkt-1)*100).toFixed(1)}%</text>
    </svg>
  );
}

// ── LIVE PORTFOLIO PAGE ───────────────────────────────────────────────────
function LivePortfolioPage({allTxns,onOpenInsider}){
  const [horizon,setHorizon]=React.useState('1M');
  const [filterSig,setFilterSig]=React.useState('All');
  const [strategy,setStrategy]=React.useState('insider'); // insider | conviction | cluster
  const HORIZONS=[{k:'1W',days:7,retKey:'ret1w'},{k:'1M',days:30,retKey:'ret1m'},{k:'6M',days:180,retKey:'ret6m'}];
  const hz=HORIZONS.find(h=>h.k===horizon)||HORIZONS[1];

  function buildPortfolio(txns){
    const eligible=txns.filter(t=>t.type==='Buy'&&!t.isPolitician&&!t.is10b51&&t.filedDate>=hz.days&&t[hz.retKey]!==null);
    const filtered=filterSig==='All'?eligible:eligible.filter(t=>getSignal(t).key===filterSig);
    const STAKE=10000;
    const trades=filtered.map(t=>{
      const ret=t[hz.retKey]||0;
      const alpha=getAlpha(t);
      const alVal=hz.k==='1W'?alpha.alpha1w:hz.k==='1M'?alpha.alpha1m:alpha.alpha6m;
      const mktRet=hz.k==='1W'?alpha.mkt1w:hz.k==='1M'?alpha.mkt1m:alpha.mkt6m;
      return {txn:t,ret,alpha:alVal,mktRet,gain:STAKE*ret,mktGain:STAKE*mktRet,sectorEtf:alpha.sectorEtf};
    }).sort((a,b)=>b.alpha-a.alpha);
    const totalInvested=trades.length*10000;
    const totalGain=trades.reduce((s,t)=>s+t.gain,0);
    const totalMktGain=trades.reduce((s,t)=>s+t.mktGain,0);
    const portRet=totalInvested>0?totalGain/totalInvested:0;
    const mktRet2=totalInvested>0?totalMktGain/totalInvested:0;
    const al=portRet-mktRet2;
    const winners=trades.filter(t=>t.alpha>0).length;
    const winRate=trades.length>0?Math.round(winners/trades.length*100):0;
    const rets=trades.map(t=>t.ret);
    const mean2=rets.reduce((s,r)=>s+r,0)/Math.max(rets.length,1);
    const variance=rets.reduce((s,r)=>s+Math.pow(r-mean2,2),0)/Math.max(rets.length,1);
    const sharpe=variance>0?+(mean2/(Math.sqrt(variance))*Math.sqrt(252/hz.days)).toFixed(2):0;
    // Cumulative equity
    const sorted=[...trades].sort((a,b)=>b.txn.filedDate-a.txn.filedDate);
    const portCum=[],mktCum=[];
    let pv=1,mv=1;
    sorted.forEach(t=>{pv*=(1+t.ret);mv*=(1+t.mktRet);portCum.push(pv);mktCum.push(mv);});
    const dd=maxDrawdown(portCum);
    const annRet=hz.k==='6M'?portRet*2:hz.k==='1M'?portRet*12:portRet*52;
    const calmar=dd>0?+(annRet/dd).toFixed(2):0;
    return {trades,portRet,mktRet:mktRet2,alpha:al,winRate,sharpe,portCum,mktCum,dd,calmar,totalInvested};
  }

  // Build three strategy variants for comparison
  const insiderPort=buildPortfolio(allTxns);
  const convPort=buildPortfolio(allTxns.filter(t=>getSignal(t).key==='conviction'));
  // cluster = tickers with 2+ insiders buying
  const clusterTickerSet=new Set(
    Object.entries(allTxns.filter(t=>t.type==='Buy').reduce((m,t)=>{if(!m[t.ticker])m[t.ticker]=new Set();m[t.ticker].add(t.insider);return m;},{}))
      .filter(([,s])=>s.size>=2).map(([tk])=>tk)
  );
  const clusterPort=buildPortfolio(allTxns.filter(t=>clusterTickerSet.has(t.ticker)));

  const port=strategy==='conviction'?convPort:strategy==='cluster'?clusterPort:insiderPort;
  const {trades,portRet,mktRet,alpha,winRate,sharpe,portCum,mktCum,dd,calmar}=port;

  return (
    <div>
      <div style={{marginBottom:20}}>
        <div style={{fontFamily:'var(--font-serif)',fontSize:28,fontWeight:900,color:'var(--ink)',letterSpacing:'-0.5px'}}>Signal Portfolio</div>
        <div style={{fontSize:13,color:'var(--ink-soft)',marginTop:2}}>Equal-weight $10K per trade. Excludes 10b5-1 pre-planned buys. Shows what following these signals would have returned vs buying the sector ETF instead.</div>
      </div>
      {/* Controls */}
      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)'}}>PERIOD</div>
        {HORIZONS.map(h=>(
          <button key={h.k} className={'chip'+(horizon===h.k?' chip-active':'')} onClick={()=>setHorizon(h.k)}>{h.k}</button>
        ))}
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginLeft:12}}>STRATEGY</div>
        {[{k:'insider',l:'All Insiders'},{k:'conviction',l:'Conviction Only'},{k:'cluster',l:'Cluster Buys'}].map(s=>(
          <button key={s.k} className={'chip'+(strategy===s.k?' chip-active':'')} onClick={()=>setStrategy(s.k)}>{s.l}</button>
        ))}
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginLeft:12}}>SIGNAL</div>
        {['All','conviction','strategic','opportunistic'].map(s=>(
          <button key={s} className={'chip'+(filterSig===s?' chip-active':'')} onClick={()=>setFilterSig(s)} style={{textTransform:'capitalize'}}>{s}</button>
        ))}
        <button className="export-btn" style={{marginLeft:'auto'}} onClick={()=>exportCSV(trades.map(t=>t.txn),'vp-portfolio.csv')}>↓ CSV</button>
        <span style={{fontSize:11,color:'var(--ink-soft)'}}>{trades.length} trades</span>
      </div>

      {/* Strategy comparison mini-table */}
      <div style={{background:'var(--bg-soft)',border:'1px solid var(--rule-soft)',borderRadius:8,padding:'14px 16px',marginBottom:16}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginBottom:10}}>Strategy Comparison — {horizon} hold period</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
          {[{label:'All Insiders',p:insiderPort},{label:'Conviction Only',p:convPort},{label:'Cluster Buys',p:clusterPort}].map(({label,p})=>{
            const beating=p.alpha>0;
            return (
              <div key={label} style={{background:'var(--bg)',border:`2px solid ${beating?'rgba(46,125,79,0.4)':'var(--rule-soft)'}`,borderRadius:6,padding:'10px 12px'}}>
                <div style={{fontSize:10,fontWeight:700,color:'var(--ink-soft)',marginBottom:6}}>{label}</div>
                <div style={{fontFamily:'var(--font-mono)',fontSize:18,fontWeight:800,color:p.portRet>=0?'var(--buy)':'var(--sell)',marginBottom:2}}>{p.portRet>=0?'+':''}{(p.portRet*100).toFixed(1)}%</div>
