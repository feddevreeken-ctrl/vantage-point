                    <div style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',fontFamily:'var(--font-mono)',fontSize:12,fontWeight:700,color:'var(--ink)'}}>{row.ret>=0?'+':''}{(row.ret*100).toFixed(1)}%</div>
                  </div>
                </div>
              ))}
              {alpha!==0&&(
                <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',borderRadius:6,background:alpha>0?'#e8f5e9':'#fce8e8',border:alpha>0?'1px solid #b8dfc4':'1px solid #e8c4c4'}}>
                  <span style={{fontSize:16}}>{alpha>0?'🏆':'⚠'}</span>
                  <span style={{fontSize:12,fontWeight:700,color:alpha>=0?'var(--buy)':'var(--sell)'}}>
                    {alpha>=0?'Insider signals BEAT the market':'Insider signals underperformed'} by <strong>{Math.abs(alpha*100).toFixed(1)}%</strong> over {horizon} — {alpha>=0?'following insiders added real alpha over passive ETF investing':'this period, a passive ETF approach would have done better'}
                  </span>
                </div>
              )}
            </div>
          );
        })()}
      </div>
      {/* Trade-by-trade breakdown */}
      <div style={{background:'var(--bg-soft)',border:'1px solid var(--rule-soft)',borderRadius:8,padding:'16px'}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginBottom:12}}>Trade Log — {hz.k} Results</div>
        {trades.length===0&&<div style={{textAlign:'center',padding:30,color:'var(--ink-soft)'}}>No trades with confirmed {hz.k} return data yet.</div>}
        {trades.map(({txn,ret,alpha:alVal,mktRet:mr,sectorEtf})=>{
          const al=alphaLabel(alVal);
          const sig=getSignal(txn);
          return (
            <div key={txn.id} className="portfolio-row" onClick={()=>onOpenInsider&&onOpenInsider(txn)}>
              <div className="pf-ticker" style={{color:alVal>=0?'var(--buy)':'var(--sell)'}}>{txn.ticker}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600,color:'var(--ink)'}}>{txn.insider} <span style={{fontWeight:400,color:'var(--ink-soft)'}}>· {txn.title}</span></div>
                <div style={{display:'flex',gap:6,marginTop:3,flexWrap:'wrap'}}>
                  <span className={'sig-badge sig-'+sig.key}>{sig.label}</span>
                  {txn.unusualOptions&&<span className="badge-options">⚡ Calls ↑</span>}
                  {txn.shortInterest>25&&<span className="badge-squeeze">🔥 {txn.shortInterest}% SI</span>}
                  <span style={{fontSize:10,color:'var(--ink-soft)'}}>{fmtDate(txn.filedDate)} · {fmt$(txn.value)}</span>
                </div>
              </div>
              <div style={{textAlign:'right',flexShrink:0}}>
                <div style={{display:'flex',gap:8,alignItems:'center',justifyContent:'flex-end',marginBottom:3}}>
                  <span style={{fontSize:10,color:'var(--ink-soft)'}}>Stock: <span style={{fontFamily:'var(--font-mono)',fontWeight:700,color:ret>=0?'var(--buy)':'var(--sell)'}}>{ret>=0?'+':''}{(ret*100).toFixed(1)}%</span></span>
                  <span style={{fontSize:10,color:'var(--ink-soft)'}}>vs {sectorEtf}: <span style={{fontFamily:'var(--font-mono)',fontWeight:600,color:'var(--ink-soft)'}}>{mr>=0?'+':''}{(mr*100).toFixed(1)}%</span></span>
                </div>
                <span className="pf-alpha" style={{background:al.bg,color:al.color}}>{al.label} {alVal>=0?'+':''}{(alVal*100).toFixed(1)}%</span>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{marginTop:12,fontSize:11,color:'var(--ink-soft)',fontStyle:'italic'}}>Snapshot backtest using historical data from the current local build. Past performance does not guarantee future results. Not investment advice.</div>
    </div>
  );
}

// ── MY PORTFOLIO (Trading 212) ─────────────────────────────────────────────
function MyPortfolioPage({allTxns,prices,onOpenInsider}){
  const [apiKey,setApiKey]=React.useState(()=>localStorage.getItem('vp_t212_key')||'');
  const [inputKey,setInputKey]=React.useState('');
  const [holdings,setHoldings]=React.useState(()=>{
    try{return JSON.parse(localStorage.getItem('vp_t212_holdings')||'null')||null;}catch{return null;}
  });
  const [loading,setLoading]=React.useState(false);
  const [error,setError]=React.useState('');
  const [lastFetched,setLastFetched]=React.useState(()=>localStorage.getItem('vp_t212_fetched')||'');
  const [sortBy,setSortBy]=React.useState('value'); // 'value','alpha','risk'

  // T212 Live API fetch — CORS proxy required since browser can't hit T212 directly
  // We use a lightweight approach: store holdings manually or via CSV paste
  async function fetchT212(key){
    setLoading(true);setError('');
    try{
      // T212 API: GET https://live.trading212.com/api/v0/equity/portfolio
      // Browser can't hit this directly due to CORS — we'll attempt and handle gracefully
      const resp=await fetch('https://live.trading212.com/api/v0/equity/portfolio',{
        headers:{'Authorization':key,'Content-Type':'application/json'},
      });
      if(!resp.ok){
        if(resp.status===401) throw new Error('Invalid API key. Make sure you copied the full key from T212 → Settings → API.');
        if(resp.status===403) throw new Error('API access not enabled. Enable it in T212 → Settings → API (requires verified account).');
        throw new Error(`T212 returned ${resp.status}. Check your key and try again.`);
      }
      const data=await resp.json();
      // T212 response is array of {ticker, quantity, averagePrice, currentPrice, ppl, fxPpl, initialFillDate, frontend, maxBuy, maxSell, pieQuantity}
      const h=Array.isArray(data)?data:[];
      localStorage.setItem('vp_t212_holdings',JSON.stringify(h));
      localStorage.setItem('vp_t212_key',key);
      localStorage.setItem('vp_t212_fetched',new Date().toISOString());
      setHoldings(h);setApiKey(key);
      setLastFetched(new Date().toISOString());
    }catch(e){
      // CORS will throw a TypeError — detect and give helpful message
      if(e instanceof TypeError&&e.message.includes('fetch')){
        setError('CORS blocked: T212 blocks direct browser requests. Paste your holdings CSV below instead — export from T212 → History → Export.');
      } else {
        setError(e.message||'Unknown error');
      }
    }finally{setLoading(false);}
  }

  // CSV fallback: parse T212 export CSV
  function parseCSV(text){
    const lines=text.trim().split('\n');
    const header=lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
    const rows=lines.slice(1).map(line=>{
      const vals=line.split(',').map(v=>v.trim().replace(/"/g,''));
      const obj={};header.forEach((h,i)=>obj[h]=vals[i]);
      return obj;
    });
    // T212 CSV columns vary; handle both formats
    const parsed=rows.filter(r=>r['Ticker']||r['ticker']||r['Symbol']).map(r=>{
      const ticker=(r['Ticker']||r['ticker']||r['Symbol']||'').toUpperCase();
      const qty=parseFloat(r['Shares']||r['Quantity']||r['quantity']||'0')||0;
      const avgPrice=parseFloat(r['Average price']||r['averagePrice']||r['Avg Price']||'0')||0;
      const curPrice=parseFloat(r['Current price']||r['currentPrice']||r['Price']||'0')||0;
      const ppl=parseFloat(r['P/L']||r['ppl']||r['Profit/Loss']||'0')||0;
      return {ticker,quantity:qty,averagePrice:avgPrice,currentPrice:curPrice,ppl,source:'csv'};
    }).filter(r=>r.ticker&&r.quantity>0);
    if(!parsed.length){setError('Could not parse CSV — make sure it\'s a T212 export with Ticker/Shares columns.');return;}
    localStorage.setItem('vp_t212_holdings',JSON.stringify(parsed));
    localStorage.setItem('vp_t212_fetched',new Date().toISOString());
    setHoldings(parsed);
    setLastFetched(new Date().toISOString());
    setError('');
  }

  function handleCSVDrop(e){
    e.preventDefault();
    const file=e.dataTransfer.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>parseCSV(ev.target.result);
    reader.readAsText(file);
  }

  function clearData(){
    localStorage.removeItem('vp_t212_holdings');
    localStorage.removeItem('vp_t212_key');
    localStorage.removeItem('vp_t212_fetched');
    setHoldings(null);setApiKey('');setInputKey('');setLastFetched('');
  }

  // Enrich holdings with insider data
  const enriched=React.useMemo(()=>{
    if(!holdings) return [];
    return holdings.map(h=>{
      const tk=h.ticker;
      // Insider activity in last 90 days for this ticker
      const cutoff=new Date();cutoff.setDate(cutoff.getDate()-90);
      const recentTxns=allTxns.filter(t=>t.ticker===tk&&new Date(t.tradeDate)>=cutoff);
      const recentBuys=recentTxns.filter(t=>t.type==='Buy');
      const recentSells=recentTxns.filter(t=>t.type==='Sell');
      const topBuy=recentBuys.sort((a,b)=>b.value-a.value)[0]||null;
      const topSell=recentSells.sort((a,b)=>b.value-a.value)[0]||null;
      // Risk flag: net insider selling
      const buyValue=recentBuys.reduce((s,t)=>s+t.value,0);
      const sellValue=recentSells.reduce((s,t)=>s+t.value,0);
      const netSentiment=buyValue-sellValue; // positive = net buy
      const hasRisk=sellValue>buyValue&&sellValue>100000;
      // Cluster: 2+ insiders buying
      const clusterBuyers=new Set(recentBuys.map(t=>t.insider));
      const isCluster=clusterBuyers.size>=2;
      // P&L
      const ppl=h.ppl!==undefined?h.ppl:((h.currentPrice-h.averagePrice)*h.quantity);
      const pplPct=h.averagePrice>0?((h.currentPrice||h.averagePrice)-h.averagePrice)/h.averagePrice:0;
      const value=(h.currentPrice||h.averagePrice)*h.quantity||h.quantity*h.averagePrice;
      // Alpha: did insiders buy before price went up?
      let insiderAlpha=null;
      if(topBuy&&topBuy.ret1m!==null){insiderAlpha=topBuy.ret1m;}
      return {...h,ticker:tk,value,ppl,pplPct,recentBuys,recentSells,topBuy,topSell,hasRisk,isCluster,netSentiment,insiderAlpha};
    }).filter(h=>h.value>0);
  },[holdings,allTxns]);

  // Sort
  const sorted=React.useMemo(()=>{
    const arr=[...enriched];
    if(sortBy==='value') arr.sort((a,b)=>b.value-a.value);
    else if(sortBy==='alpha') arr.sort((a,b)=>(b.recentBuys.length+b.isCluster*3)-(a.recentBuys.length+a.isCluster*3));
    else if(sortBy==='risk') arr.sort((a,b)=>(b.hasRisk?1:0)-(a.hasRisk?1:0)||(b.recentSells.length-a.recentSells.length));
    else if(sortBy==='pnl') arr.sort((a,b)=>b.pplPct-a.pplPct);
    return arr;
  },[enriched,sortBy]);

  // Portfolio stats
  const stats=React.useMemo(()=>{
    const total=enriched.reduce((s,h)=>s+h.value,0);
    const totalPpl=enriched.reduce((s,h)=>s+h.ppl,0);
    const totalCost=enriched.reduce((s,h)=>s+(h.averagePrice*h.quantity),0);
    const pnlPct=totalCost>0?totalPpl/totalCost:0;
    const withBuys=enriched.filter(h=>h.recentBuys.length>0).length;
    const withRisk=enriched.filter(h=>h.hasRisk).length;
    const clusters=enriched.filter(h=>h.isCluster).length;
    // Sector breakdown
    const bySector={};
    enriched.forEach(h=>{
      const txn=allTxns.find(t=>t.ticker===h.ticker);
      const sec=txn?.sector||'Other';
      bySector[sec]=(bySector[sec]||0)+h.value;
    });
    // SPY return proxy — use prices data if available
    let spyRet=null;
    const spyRows=prices['SPY']||[];
    if(spyRows.length>=63){
      const cur=spyRows[spyRows.length-1][4];
      const old=spyRows[spyRows.length-63][4];
      spyRet=old>0?(cur-old)/old:null;
    }
    return {total,totalPpl,pnlPct,withBuys,withRisk,clusters,bySector,spyRet};
  },[enriched,allTxns,prices]);

  // Donut SVG for sector breakdown
  function SectorDonut({bySector,size=120}){
    const total=Object.values(bySector).reduce((s,v)=>s+v,0);
    if(!total) return null;
    const COLORS=['#2e7d4f','#3a6da3','#9b7a22','#a32a2a','#6a3080','#c97a3a','#2a7a8c','#5a6a3a','#7a4a2a'];
    const entries=Object.entries(bySector).sort((a,b)=>b[1]-a[1]);
    let cumAngle=0;
    const r=46,cx=60,cy=60;
    const paths=entries.map(([sec,val],i)=>{
      const angle=(val/total)*360;
      const startAngle=cumAngle;
      cumAngle+=angle;
      const start=polarToCart(cx,cy,r,startAngle-90);
      const end=polarToCart(cx,cy,r,cumAngle-90);
      const large=angle>180?1:0;
      const d=`M${cx},${cy} L${start.x},${start.y} A${r},${r},0,${large},1,${end.x},${end.y} Z`;
      return <path key={sec} d={d} fill={COLORS[i%COLORS.length]} opacity={0.85}/>;
    });
    function polarToCart(cx,cy,r,angleDeg){
      const rad=angleDeg*Math.PI/180;
      return {x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};
    }
    return (
      <div style={{display:'flex',gap:20,alignItems:'center',flexWrap:'wrap'}}>
        <svg width={size} height={size} viewBox="0 0 120 120">
          {paths}
          <circle cx={60} cy={60} r={26} fill="var(--bg-card)"/>
          <text x={60} y={64} textAnchor="middle" fontSize={10} fontWeight={700} fill="var(--ink)" fontFamily="var(--font-mono)">{entries.length}</text>
          <text x={60} y={76} textAnchor="middle" fontSize={8} fill="var(--ink-soft)" fontFamily="var(--font-sans)">sectors</text>
        </svg>
        <div style={{display:'flex',flexDirection:'column',gap:5}}>
          {entries.slice(0,6).map(([sec,val],i)=>(
            <div key={sec} style={{display:'flex',alignItems:'center',gap:7,fontSize:11}}>
              <div style={{width:10,height:10,borderRadius:2,background:COLORS[i%COLORS.length],flexShrink:0}}/>
              <span style={{color:'var(--ink)',fontWeight:600,minWidth:100}}>{sec}</span>
              <span style={{color:'var(--ink-soft)',fontFamily:'var(--font-mono)'}}>{((val/total)*100).toFixed(1)}%</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  // Not connected yet
  if(!holdings){
    return (
      <div style={{padding:'28px 0'}}>
        <div className="t212-hero">
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:6}}>
            <div style={{width:38,height:38,background:'var(--buy)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,borderRadius:6}}>💼</div>
            <div>
              <div style={{fontFamily:'var(--font-serif)',fontSize:24,fontWeight:700,letterSpacing:'-0.4px'}}>My Portfolio</div>
              <div style={{fontSize:12,color:'var(--ink-soft)',marginTop:2}}>Connect your Trading 212 pie to see insider signals on your actual holdings</div>
            </div>
          </div>

          {/* Option 1: API key */}
          <div style={{background:'var(--bg-soft)',border:'1px solid var(--rule-soft)',padding:'16px 18px',marginTop:16,borderRadius:6}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginBottom:10}}>Option 1 — Live API (auto-updates)</div>
            <div style={{fontSize:12,color:'var(--ink-mid)',marginBottom:10}}>
              Get your key from <strong>T212 → Settings → API (Beta)</strong>, generate a key, copy it here.
            </div>
            <div className="t212-api-row">
              <input
                className="t212-api-input"
                type="password"
                placeholder="Paste your Trading 212 API key…"
                value={inputKey}
                onChange={e=>setInputKey(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&inputKey.trim()&&fetchT212(inputKey.trim())}
              />
              <button className="t212-btn" disabled={!inputKey.trim()||loading} onClick={()=>fetchT212(inputKey.trim())}>
                {loading?'Fetching…':'Connect →'}
              </button>
            </div>
            {error&&<div className="t212-err">{error}</div>}
            <div className="t212-note">Your API key is stored only in your browser's localStorage and never sent anywhere except directly to T212's servers.</div>
          </div>

          {/* Option 2: CSV drop */}
          <div
            style={{background:'var(--bg-soft)',border:'2px dashed var(--rule-soft)',padding:'20px 18px',marginTop:12,borderRadius:6,textAlign:'center',cursor:'default',transition:'border-color .15s'}}
            onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--buy)';}}
            onDragLeave={e=>e.currentTarget.style.borderColor='var(--rule-soft)'}
            onDrop={e=>{e.currentTarget.style.borderColor='var(--rule-soft)';handleCSVDrop(e);}}
          >
            <div style={{fontSize:10,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginBottom:8}}>Option 2 — CSV Export (offline)</div>
            <div style={{fontSize:28,marginBottom:6}}>📂</div>
            <div style={{fontSize:13,color:'var(--ink-mid)',fontWeight:600}}>Drop your T212 CSV here</div>
            <div style={{fontSize:11,color:'var(--ink-soft)',marginTop:4}}>Export from T212 → History → Export → Portfolio as CSV</div>
            <div style={{marginTop:12}}>
              <label style={{display:'inline-block',background:'var(--bg-card)',border:'1px solid var(--rule-soft)',padding:'7px 16px',fontSize:11,fontWeight:600,cursor:'pointer'}}>
                or Browse File
                <input type="file" accept=".csv,.txt" style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>parseCSV(ev.target.result);r.readAsText(f);}}}/>
              </label>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // Connected — show portfolio
  const spyBeat=stats.spyRet!==null&&stats.pnlPct>stats.spyRet;
  return (
    <div style={{padding:'20px 0'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
        <div>
          <div style={{fontFamily:'var(--font-serif)',fontSize:26,fontWeight:700,letterSpacing:'-0.4px'}}>My Portfolio</div>
          <div style={{fontSize:11,color:'var(--ink-soft)',marginTop:2}}>
            {enriched.length} holdings · T212 data
            {lastFetched&&<span> · Updated {new Date(lastFetched).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span>}
          </div>
        </div>
        <div style={{display:'flex',gap:8}}>
          {apiKey&&<button className="t212-btn" disabled={loading} onClick={()=>fetchT212(apiKey)} style={{fontSize:11,padding:'7px 14px'}}>{loading?'…':'↺ Refresh'}</button>}
          <button className="t212-btn danger" onClick={clearData} style={{fontSize:11,padding:'7px 14px'}}>Disconnect</button>
        </div>
      </div>

      {/* KPI strip */}
      <div className="stats-grid" style={{gridTemplateColumns:'repeat(6,1fr)',marginBottom:16}}>
        <div className="stat-box">
          <div className="stat-box-l">Portfolio Value</div>
          <div className="stat-box-v">{fmt$(stats.total)}</div>
        </div>
        <div className="stat-box">
          <div className="stat-box-l">Total P&L</div>
          <div className={'stat-box-v '+(stats.totalPpl>=0?'buy':'sell')}>{stats.totalPpl>=0?'+':''}{fmt$(stats.totalPpl)}</div>
        </div>
        <div className="stat-box">
          <div className="stat-box-l">Return</div>
          <div className={'stat-box-v '+(stats.pnlPct>=0?'buy':'sell')}>{stats.pnlPct>=0?'+':''}{(stats.pnlPct*100).toFixed(1)}%</div>
        </div>
        <div className="stat-box">
          <div className="stat-box-l">vs S&P 500 (3m)</div>
          {stats.spyRet!==null
            ?<div className={'stat-box-v '+(spyBeat?'buy':'sell')}>{spyBeat?'▲ Beating':'▼ Behind'}<span style={{fontFamily:'var(--font-mono)',fontSize:13,display:'block',marginTop:2}}>{stats.spyRet>=0?'+':''}{(stats.spyRet*100).toFixed(1)}% SPY</span></div>
            :<div className="stat-box-v" style={{fontSize:14}}>—</div>}
        </div>
        <div className="stat-box">
          <div className="stat-box-l">Insider Buys (90d)</div>
          <div className={'stat-box-v '+(stats.withBuys>0?'buy':'')}>
            {stats.withBuys}<span style={{fontSize:13,color:'var(--ink-soft)',fontFamily:'var(--font-sans)'}}>/{enriched.length} holdings</span>
          </div>
        </div>
        <div className="stat-box">
          <div className="stat-box-l">Risk Flags</div>
          <div className={'stat-box-v '+(stats.withRisk>0?'sell':'')}>{stats.withRisk>0?`⚠ ${stats.withRisk} holdings`:'✓ None'}</div>
        </div>
      </div>

      {/* Sector donut + vs market */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:16}}>
        <div style={{background:'var(--bg-card)',border:'1px solid var(--rule-soft)',padding:'18px 20px'}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginBottom:14}}>Allocation by Sector</div>
          <SectorDonut bySector={stats.bySector}/>
        </div>
        <div style={{background:'var(--bg-card)',border:'1px solid var(--rule-soft)',padding:'18px 20px'}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)',marginBottom:14}}>Portfolio vs Market</div>
          {(()=>{
            const rows=[
              {label:'My Portfolio',ret:stats.pnlPct,color:stats.pnlPct>=0?'var(--buy)':'var(--sell)'},
              ...(stats.spyRet!==null?[{label:'S&P 500 (3m)',ret:stats.spyRet,color:'#7a9cc2'}]:[]),
            ];
            const maxR=Math.max(...rows.map(r=>Math.abs(r.ret)),0.01);
            return (
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {rows.map(row=>(
                  <div key={row.label} style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{fontSize:11,fontWeight:600,minWidth:140,color:'var(--ink)'}}>{row.label}</div>
                    <div style={{flex:1,height:24,background:'var(--bg-soft)',borderRadius:3,overflow:'hidden',position:'relative'}}>
                      <div style={{position:'absolute',left:0,top:0,bottom:0,width:(Math.abs(row.ret)/maxR*100)+'%',background:row.color,opacity:0.8,borderRadius:3}}/>
                      <div style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',fontFamily:'var(--font-mono)',fontSize:11,fontWeight:700,color:'var(--ink)'}}>{row.ret>=0?'+':''}{(row.ret*100).toFixed(1)}%</div>
                    </div>
                  </div>
                ))}
                {stats.spyRet!==null&&(
                  <div style={{marginTop:8,padding:'8px 12px',borderRadius:4,background:spyBeat?'#e8f5e9':'#fce8e8',border:spyBeat?'1px solid #b8dfc4':'1px solid #e8c4c4',fontSize:12,fontWeight:700,color:spyBeat?'var(--buy)':'var(--sell)'}}>
                    {spyBeat?'🏆':'📉'} Your portfolio {spyBeat?'beat':'trailed'} the S&P 500 by <strong>{Math.abs((stats.pnlPct-stats.spyRet)*100).toFixed(1)}%</strong>
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      </div>

      {/* Insider signal summary for your holdings */}
      {stats.clusters>0&&(
        <div style={{background:'#e8f5e9',border:'1px solid #b8dfc4',borderLeft:'4px solid var(--buy)',padding:'12px 16px',marginBottom:16,borderRadius:4}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--buy)',marginBottom:3}}>🚀 Cluster buy signal on {stats.clusters} of your holdings</div>
          <div style={{fontSize:11,color:'var(--ink-mid)'}}>Multiple insiders are buying in the same name(s) you own — historically the strongest signal in insider data.</div>
        </div>
      )}

      {/* Holdings table */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--ink-soft)'}}>Holdings ({enriched.length})</div>
        <div style={{display:'flex',gap:6}}>
          {[['value','By Value'],['alpha','By Insider Signal'],['risk','Risks First'],['pnl','By P&L']].map(([k,l])=>(
            <button key={k} className={'chip'+(sortBy===k?' chip-active':'')} onClick={()=>setSortBy(k)} style={{fontSize:10,padding:'4px 10px'}}>{l}</button>
          ))}
        </div>
      </div>

      {sorted.map(h=>{
        const pct=(stats.total>0?h.value/stats.total*100:0).toFixed(1);
        const txn=allTxns.find(t=>t.ticker===h.ticker);
        const company=txn?.company||h.ticker;
        const holdingClass='t212-holding'+(h.isCluster?' has-buy':h.hasRisk?' has-risk':h.recentBuys.length>0?' has-buy':h.recentSells.length>0?' has-sell':'');
        return (
          <div key={h.ticker} className={holdingClass} onClick={()=>h.topBuy&&onOpenInsider&&onOpenInsider(h.topBuy)}>
            <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
              {/* Ticker */}
              <div style={{minWidth:60}}>
                <div style={{fontFamily:'var(--font-serif)',fontSize:18,fontWeight:700,letterSpacing:'-0.3px',color:'var(--ink)'}}>{h.ticker}</div>
                <div style={{fontSize:10,color:'var(--ink-soft)',marginTop:1,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{company}</div>
              </div>
              {/* Position details */}
              <div style={{flex:1,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,alignItems:'start'}}>
                <div>
                  <div style={{fontSize:9,color:'var(--ink-soft)',fontWeight:700,letterSpacing:'.6px',textTransform:'uppercase',marginBottom:2}}>Value</div>
                  <div style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:13}}>{fmt$(h.value)}</div>
                  <div style={{fontSize:10,color:'var(--ink-soft)'}}>{pct}% of portfolio</div>
                </div>
                <div>
                  <div style={{fontSize:9,color:'var(--ink-soft)',fontWeight:700,letterSpacing:'.6px',textTransform:'uppercase',marginBottom:2}}>P&L</div>
                  <div style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:13,color:h.ppl>=0?'var(--buy)':'var(--sell)'}}>{h.ppl>=0?'+':''}{fmt$(h.ppl)}</div>
                  <div style={{fontSize:10,color:h.pplPct>=0?'var(--buy)':'var(--sell)',fontWeight:600}}>{h.pplPct>=0?'+':''}{(h.pplPct*100).toFixed(1)}%</div>
                </div>
                <div>
                  <div style={{fontSize:9,color:'var(--ink-soft)',fontWeight:700,letterSpacing:'.6px',textTransform:'uppercase',marginBottom:2}}>Insider Signal (90d)</div>
                  {h.recentBuys.length===0&&h.recentSells.length===0&&(
                    <div style={{fontSize:11,color:'var(--ink-soft)'}}>No activity</div>
                  )}
                  {h.recentBuys.length>0&&(
                    <div style={{display:'flex',flexDirection:'column',gap:3}}>
                      {h.isCluster&&<span style={{fontSize:9,fontWeight:700,padding:'2px 6px',background:'var(--buy)',color:'#fff',display:'inline-block',letterSpacing:'.5px'}}>🎯 CLUSTER BUY</span>}
                      <span style={{fontSize:11,color:'var(--buy)',fontWeight:600}}>▲ {h.recentBuys.length} buy{h.recentBuys.length>1?'s':''} · {fmt$(h.recentBuys.reduce((s,t)=>s+t.value,0))}</span>
                      {h.topBuy&&<span style={{fontSize:10,color:'var(--ink-soft)'}}>{h.topBuy.insider} · {fmtDate(h.topBuy.filedDate)}</span>}
                    </div>
                  )}
                  {h.recentSells.length>0&&h.recentBuys.length===0&&(
                    <div style={{fontSize:11,color:'var(--sell)',fontWeight:600}}>▼ {h.recentSells.length} sell{h.recentSells.length>1?'s':''}</div>
                  )}
                </div>
                <div>
                  <div style={{fontSize:9,color:'var(--ink-soft)',fontWeight:700,letterSpacing:'.6px',textTransform:'uppercase',marginBottom:2}}>Risk Flags</div>
                  {h.hasRisk&&<div style={{fontSize:11,color:'var(--sell)',fontWeight:700}}>⚠ Net insider selling<br/><span style={{fontWeight:400,fontSize:10}}>Insiders sold {fmt$(h.recentSells.reduce((s,t)=>s+t.value,0))} vs {fmt$(h.recentBuys.reduce((s,t)=>s+t.value,0))} bought</span></div>}
                  {!h.hasRisk&&h.insiderAlpha!==null&&<div style={{fontSize:11,color:h.insiderAlpha>=0?'var(--buy)':'var(--sell)',fontWeight:600}}>Post-buy 1m alpha: {h.insiderAlpha>=0?'+':''}{(h.insiderAlpha*100).toFixed(1)}%</div>}
                  {!h.hasRisk&&h.insiderAlpha===null&&h.recentBuys.length===0&&<div style={{fontSize:11,color:'var(--ink-soft)'}}>—</div>}
                  {!h.hasRisk&&h.recentBuys.length>0&&h.insiderAlpha===null&&<div style={{fontSize:11,color:'var(--buy)',fontWeight:600}}>✓ Insiders buying</div>}
                </div>
              </div>
              {/* Weight bar */}
              <div style={{width:60,flexShrink:0,paddingTop:4}}>
                <div style={{width:'100%',height:4,background:'var(--bg-soft)',borderRadius:2,overflow:'hidden'}}>
                  <div style={{width:pct+'%',maxWidth:'100%',height:'100%',background:'var(--buy)',borderRadius:2}}/>
                </div>
                <div style={{fontSize:10,color:'var(--ink-soft)',textAlign:'right',marginTop:3}}>{pct}%</div>
              </div>
            </div>
          </div>
        );
      })}

      <div style={{marginTop:14,padding:'12px 16px',background:'var(--bg-soft)',border:'1px solid var(--rule-soft)',fontSize:11,color:'var(--ink-soft)',lineHeight:1.6}}>
        <strong style={{color:'var(--ink)'}}>Insider signals on your holdings are for informational purposes only.</strong> Past insider buying does not guarantee future performance. This is not investment advice. P&L figures are based on data from your T212 export and may not reflect real-time prices.
      </div>
    </div>
  );
}

// ── INSIDER SIGNAL CARD (enhanced) ────────────────────────────────────────
function InsiderSignalCard({txn,allTxns,onClick}){
  const sig=getSignal(txn,allTxns);
  const alpha=getAlpha(txn);
  const al=alphaLabel(alpha.alpha1m);
  const momentum=getConvictionMomentum(txn.insider,allTxns);
  const timeSince=getTimeSinceLastBuy(txn.insider,allTxns,txn.id);
  const isFirstBuyInLong=timeSince!==null&&timeSince>365;
  const isSqueezeSetup=txn.shortInterest>25&&txn.type==='Buy'&&!txn.is10b51;
  return (
    <div style={{background:'var(--bg-soft)',border:'1px solid var(--rule-soft)',borderRadius:8,padding:'12px 14px',cursor:'pointer',transition:'border-color .12s'}} onClick={onClick} onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent)'} onMouseLeave={e=>e.currentTarget.style.borderColor='var(--rule-soft)'}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
        <div>
          <span style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:14,color:txn.type==='Buy'?'var(--buy)':'var(--sell)'}}>{txn.type==='Buy'?'▲':'▼'} {txn.ticker}</span>
          <span style={{fontSize:11,color:'var(--ink-soft)',marginLeft:8}}>{fmtDate(txn.filedDate)}</span>
        </div>
        <span style={{fontFamily:'var(--font-mono)',fontWeight:700,fontSize:14,color:txn.type==='Buy'?'var(--buy)':'var(--sell)'}}>{fmt$(txn.value)}</span>
      </div>
      <div style={{fontSize:12,color:'var(--ink)',marginBottom:6}}>{txn.insider} <span style={{color:'var(--ink-soft)'}}>· {txn.title}</span></div>
      <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:alpha.alpha1m!==null?6:0}}>
        <span className={'sig-badge sig-'+sig.key}>{sig.label}</span>
        {txn.is10b51&&<span className="badge-10b51">10b5-1</span>}
        {txn.isForm144&&<span className="badge-form144">Form 144</span>}
        {txn.unusualOptions&&!txn.is10b51&&<span className="badge-options">⚡ Calls ↑</span>}
        {isSqueezeSetup&&<span className="badge-squeeze">🔥 Squeeze Setup</span>}
        {momentum&&momentum.rising&&!txn.is10b51&&<span className="badge-momentum">📈 Score ↑</span>}
        {isFirstBuyInLong&&<span style={{fontSize:9,padding:'1px 6px',borderRadius:3,background:'#fff3cd',color:'#856404',border:'1px solid #ffc107',fontWeight:700}}>⚠ First buy in {Math.round(timeSince/30)}mo</span>}
      </div>
      {alpha.alpha1m!==null&&<div style={{fontSize:10,color:al.color,fontWeight:700}}>{al.label}: {alpha.alpha1m>=0?'+':''}{(alpha.alpha1m*100).toFixed(1)}% alpha vs {alpha.sectorEtf}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
