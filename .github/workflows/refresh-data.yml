name: Refresh Insider Data

on:
  schedule:
    # Runs every day at 07:00 UTC (9am Amsterdam time)
    - cron: '0 7 * * *'
  workflow_dispatch: # Also allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests beautifulsoup4 lxml

      - name: Run data pipeline
        run: |
          python build_vp_snapshot.py --source index.html --out vp-data.js
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vp-data.js
          git diff --staged --quiet || git commit -m "chore: refresh insider data $(date -u +%Y-%m-%d)"
          git push origin main
